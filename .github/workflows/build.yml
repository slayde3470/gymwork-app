name: APK 빌드

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 자바 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: APK 만들기
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 이름 정리
        run: cp app/build/outputs/apk/debug/app-debug.apk hasenheide.apk

      - name: 폰에서 받을 수 있게 내보내기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" hasenheide.apk \
            --title "하젠하이데 최신 APK (빌드 ${{ github.run_number }})" \
            --notes "자동으로 만들어진 APK입니다. 아래 hasenheide.apk 를 받아서 설치하세요."
