name: APK 빌드

on:
  push:
    branches: [ main ]
    # 문서만 고친 커밋에는 공장을 돌리지 않는다 (2026-10-02).
    # 아래 목록에 있는 것'만' 바뀐 푸시는 건너뛴다.
    # 앱 코드(app/)가 한 줄이라도 바뀌면 평소대로 빌드된다.
    paths-ignore:
      - '문서/**'
      - '설명/**'
      - '.claude/**'
      - 'CLAUDE.md'
      - 'README.md'
  # 문서만 고친 뒤에도 APK 를 새로 뽑고 싶으면
  # GitHub → Actions → 'APK 빌드' → 'Run workflow' 를 손으로 누른다
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 자바 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: 계산 시험 (09-30 추가)
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: APK 만들기
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 이름 정리
        run: cp app/build/outputs/apk/debug/app-debug.apk hasenheide.apk

      - name: 폰에서 받을 수 있게 내보내기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" hasenheide.apk \
            --title "하젠하이데 최신 APK (빌드 ${{ github.run_number }})" \
            --notes "자동으로 만들어진 APK입니다. 아래 hasenheide.apk 를 받아서 설치하세요."
