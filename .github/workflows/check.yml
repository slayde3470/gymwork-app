name: 컴파일 검사 (port 가지)

# 2026-10-04 앱 옮기기 — port/** 가지에 올리면 시험 + 빌드만 돌린다(릴리스 없음).
# 로그는 로그인해야 보이므로, 실패한 줄을 '주석(annotation)'으로 남겨 로그인 없이 API 로 읽게 한다:
#   curl -s https://api.github.com/repos/slayde3470/gymwork-app/check-runs/<job id>/annotations
on:
  push:
    branches: [ 'port/**', 'check/**' ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: 시험 + 빌드
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleDebug --no-daemon --continue 2>&1 | tee build.log
      - name: 실패한 줄을 주석으로
        if: failure()
        run: |
          grep -E "^e: |^w: .*error|FAILED|AssertionError|Exception|expected:|Unresolved|Type mismatch" build.log | head -45 | while IFS= read -r l; do
            l="${l//'%'/'%25'}"; echo "::error::${l:0:900}"; done
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] && grep -o 'message="[^"]*"' "$f" | head -10 | while IFS= read -r m; do echo "::error::$(basename $f): ${m:0:600}"; done
          done; true
