<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>루틴 세트줄 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --바탕:#F6F7F6;--면:#FFFFFF;--면2:#EFF2F0;--선:#DFE4E1;--글:#1A1D1B;--흐림:#5F7169;--옅음:#94A39C;
  --강조:#2E5E4E;--강조글:#FFFFFF;--강조옅음:#E3EEE8;--종이:#E6EAE8;--띠:#1F2A25;--띠글:#F2F5F3;
  --키판:#D3D8DB;--키:#FFFFFF;--키글:#111111;--오름:#D5322A;--내림:#1D67D0;--묶음:#A8641C;--묶음옅음:#FAF0E3;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --바탕:#111413;--면:#1B1F1D;--면2:#242926;--선:#323936;--글:#E4E7E5;--흐림:#A2B4AB;--옅음:#6E7E77;
  --강조:#8ED1B7;--강조글:#00372A;--강조옅음:#1F2E28;--종이:#0A0C0B;--띠:#E4E7E5;--띠글:#111413;
  --키판:#24282A;--키:#383D40;--키글:#E4E7E5;--오름:#FF7B6E;--내림:#6AAEFF;--묶음:#E6B676;--묶음옅음:#2E271A;}}
:root[data-theme="dark"]{
  --바탕:#111413;--면:#1B1F1D;--면2:#242926;--선:#323936;--글:#E4E7E5;--흐림:#A2B4AB;--옅음:#6E7E77;
  --강조:#8ED1B7;--강조글:#00372A;--강조옅음:#1F2E28;--종이:#0A0C0B;--띠:#E4E7E5;--띠글:#111413;
  --키판:#24282A;--키:#383D40;--키글:#E4E7E5;--오름:#FF7B6E;--내림:#6AAEFF;--묶음:#E6B676;--묶음옅음:#2E271A;}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--종이);color:var(--글);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.4;letter-spacing:-.01em;font-variant-numeric:tabular-nums;padding-inline:16px;padding-block:16px 40px}
button{font:inherit;color:inherit;letter-spacing:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:focus-visible{outline:2px solid var(--강조);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;display:flex;gap:24px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
/* ── 정렬 규칙 (09-24) ──
   좌우 기준선(레일) 하나: 화면 제목 · 카드 안 내용 · 세트 줄 · 아래 버튼이 모두 같은 선에서 시작하고 끝난다.
   카드는 레일보다 8 바깥에 테두리를 둔다. 세로 간격은 4의 배수만. */
:root{--레일:16px;--카드밖:8px;--줄:40px}
.phone{width:360px;max-width:100%;background:var(--바탕);border:1px solid var(--선);border-radius:28px;overflow:hidden;position:relative;height:720px;display:flex;flex-direction:column}
/* 폰 안에서는 스크롤 막대를 보이지 않는다 — 휠 · 목록 모두 (09-24 메모) */
.scroll{flex:1;min-height:0;overflow:auto;scrollbar-width:none;-ms-overflow-style:none}
.phone *::-webkit-scrollbar{width:0;height:0;display:none}
.top{padding:16px var(--레일) 8px}
.h1{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.sub{font-size:13px;color:var(--흐림);display:flex;align-items:center;gap:8px;line-height:1.4;margin-top:4px}
.card{background:var(--면);border-radius:16px;margin:8px var(--카드밖);padding:4px calc(var(--레일) - var(--카드밖)) 8px}
.exrow{display:flex;align-items:center;gap:8px;height:44px}
.nm{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:11px;color:var(--옅음);margin-left:auto;white-space:nowrap}
.up{color:var(--오름);font-weight:700}.down{color:var(--내림);font-weight:700}
.ref{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--옅음);flex:none}
.ref.has{color:var(--강조);background:var(--강조옅음)}
.ref svg{width:16px;height:16px}
.linkbox{border:1px solid var(--선);border-radius:8px;padding:8px;margin:0 0 8px}
.lab{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--옅음);margin-bottom:4px}
.fake{height:36px;border:1px solid var(--선);border-radius:8px;display:flex;align-items:center;padding:0 8px;font-size:12px;color:var(--옅음);margin-bottom:4px}
.fake span{margin-left:auto;font-size:11px}
.link{display:flex;align-items:center;gap:8px;height:32px;margin:0 0 4px}
.thumb{width:28px;height:28px;border-radius:6px;flex:none;background:linear-gradient(135deg,#3a3f3d,#6b7a73);display:grid;place-items:center}
.thumb svg{width:12px;height:12px}
.linktext{font-size:12px;color:var(--강조);text-decoration:underline;text-underline-offset:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addlink{font-size:12px;color:var(--옅음)}
/* 세트 줄 묶음 — 따로 테두리를 두지 않는다. 줄이 레일에 그대로 맞도록 */
.box{display:flex;flex-direction:column;gap:4px;margin:0 0 8px}
.row4{display:flex;gap:2px;align-items:center}
.del{width:14px;height:var(--줄);flex:none;display:grid;place-items:center;color:var(--옅음)}
.del svg{width:12px;height:12px}
/* 세트가 들어오고 나갈 때 — 어디가 바뀌었는지 눈으로 좇을 수 있게 (09-24 메모) */
@keyframes 세트들어옴{from{opacity:0;max-height:0;transform:translateY(-10px)}to{opacity:1;max-height:var(--줄);transform:none}}
@keyframes 잠깐물듦{from{background:var(--강조옅음);box-shadow:inset 0 0 0 1.5px var(--강조)}to{background:var(--면2);box-shadow:none}}
.row4.들어옴{animation:세트들어옴 .22s cubic-bezier(.2,.8,.3,1)}
.kbd{border-top:1px solid var(--선)}
.row4.들어옴 .k{animation:잠깐물듦 .7s ease-out}
@media (prefers-reduced-motion:reduce){.row4.들어옴,.row4.들어옴 .k{animation:none}}
.k{flex:1;height:var(--줄);border-radius:8px;background:var(--면2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.k small{font-size:11px;color:var(--옅음);white-space:nowrap}
.k span{font-size:13px;font-weight:700;white-space:nowrap}
.k.on{flex:1.69;background:var(--면);box-shadow:inset 0 0 0 1.5px var(--강조);flex-direction:row;justify-content:center;padding:0}
.k.on.횟수칸{flex:1.6}
.k.on.휴식칸{flex:1.51}
/* 빈 자리를 − ＋ 가 나눠 갖는다 — 누를 수 있는 범위를 넓게, 값은 가운데 (09-24 메모) */
.k.on .mid{display:flex;flex-direction:column;align-items:center;min-width:0;flex:none;padding:0 2px}
.k.on .pm{flex:1;width:auto;min-width:28px}
.k.on .val{font-size:15px}
.k.세트칸{flex:.75}     /* 세트는 숫자 한두 자리뿐 — 좁게 */
.k.횟수칸{flex:.85}     /* 세트를 키운 만큼 횟수에서 덜어냈다 */
.k.on.세트칸{flex:1.07}
.k.on.세트칸 .pm{width:24px}
.pm{width:30px;align-self:stretch;color:var(--강조);font-size:18px;font-weight:700;display:grid;place-items:center}
.wheelrow{display:flex;gap:2px}
.wheel{position:relative;height:170px;overflow-y:auto;background:var(--면2);border-radius:8px;scrollbar-width:none}
.wheel::-webkit-scrollbar{display:none}
.wv{height:34px;width:100%;display:grid;place-items:center;font-size:13px;color:var(--흐림)}
.wv.on{background:var(--강조옅음);color:var(--강조);font-weight:700;font-size:18px}
.kbd{background:var(--키판);padding:6px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:none}
.key{height:38px;background:var(--키);color:var(--키글);border-radius:8px;font-size:17px;display:grid;place-items:center}
.chiprow{display:flex;gap:4px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.gchip{flex:none;height:20px;padding:0 8px;border-radius:99px;background:var(--면2);font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px;color:var(--흐림)}
.bar{display:flex;gap:8px;padding:8px var(--레일);background:var(--면);border-top:1px solid var(--선);flex:none}
.btn{flex:1;height:40px;border-radius:8px;background:var(--면2);color:var(--글);font-size:13px;font-weight:700;display:grid;place-items:center}
.btn.main{background:var(--강조);color:var(--강조글)}
.sheetwrap{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end}
/* 고르는 물음은 화면 가운데에 — 손이 멀리 가지 않게, 좌우로는 여백을 둔다 (09-24 메모) */
.dlgwrap{position:absolute;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center}
.dlg{width:60%;min-width:208px;background:var(--면);border-radius:16px;padding:16px}
.dlg h3{margin:0 0 4px;font-size:18px;letter-spacing:-.02em;text-wrap:balance}
.sheet{width:100%;background:var(--면);border-radius:16px 16px 0 0;padding:16px var(--레일)}
.sheet h3{margin:0 0 8px;font-size:18px;letter-spacing:-.02em}
.opt{display:flex;align-items:center;gap:8px;height:44px;border-bottom:1px solid var(--선);font-size:13px}
.opt .tick{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--선);display:grid;place-items:center;flex:none;font-size:12px;color:var(--강조글)}
.opt .tick.on{background:var(--강조);border-color:var(--강조)}
.prev{font-size:12px;color:var(--흐림);background:var(--면2);border-radius:8px;padding:8px;margin:8px 0}
.setline{display:flex;align-items:center;justify-content:space-between;height:44px;font-size:13px;color:var(--흐림)}
.seg{display:flex;gap:4px}
.seg button{height:28px;padding:0 10px;border-radius:99px;background:var(--면2);font-size:12px;color:var(--흐림)}
.seg button.on{background:var(--강조);color:var(--강조글);font-weight:700}
.toast{position:absolute;left:12px;right:12px;bottom:12px;background:var(--띠);color:var(--띠글);border-radius:12px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;min-height:44px;font-size:12px}
.toast button{color:var(--띠글);font-weight:700;padding:0 8px;height:32px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{height:32px;padding:0 14px;border-radius:99px;background:var(--면);font-size:13px;color:var(--흐림)}
.tab.on{background:var(--강조);color:var(--강조글);font-weight:700}
.side{width:380px;max-width:100%;display:flex;flex-direction:column;gap:12px}
.note{background:var(--면);border-radius:16px;padding:16px;font-size:13px;line-height:1.7;color:var(--흐림)}
.note h2{font-size:18px;margin:0 0 8px;color:var(--글);letter-spacing:-.02em}
.note b{color:var(--글)}
.note ul{margin:6px 0 0;padding-left:18px}
.note li{margin-bottom:4px}
.tag{font-size:11px;color:var(--옅음);margin-top:8px}
</style>

<div class="wrap">
  <div class="phone" id="phone">
    <div class="scroll" id="screen"></div>
    <div class="kbd" id="kbd" hidden></div>
    <div class="bar" id="bar"></div>
    <div id="sheetHost"></div>
    <div class="toast" id="toast" hidden><span id="toastT"></span><button id="toastX">닫기</button></div>
  </div>

  <div class="side">
    <div class="tabs" id="tabs">
      <button class="tab on" data-v="루틴">루틴</button>
      <button class="tab" data-v="운동">운동 중 · 타이트하게</button>
      <button class="tab" data-v="설정">볼륨 자동 올리기</button>
    </div>
    <div class="note" id="note"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const 분초=t=>`${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`;
const 무글=w=>Number.isInteger(w)?String(w):w.toFixed(1);
const 콤마=n=>Math.round(n).toLocaleString();
const 일RM=(w,r)=>w*(1+r/30);

// ── 자료 ── 기본값: 1세트 · 휴식 1:00 (09-24 메모)
let 화면="루틴";
let 종목=[
  {이름:"벤치프레스", 성장:7, 링크:{글:"유튜브 · 벤치프레스 자세", url:"https://youtu.be/..."},
   세트:[{w:60,r:10,t:60},{w:65,r:8,t:60},{w:65,r:8,t:90}]},
  {이름:"인클라인 덤벨프레스", 성장:3, 링크:null, 세트:[{w:24,r:10,t:60},{w:24,r:10,t:60}]},
  {이름:"케이블 플라이", 성장:-2, 링크:null, 세트:[{w:15,r:12,t:60}]},
];
let 열린=0;                 // 펼친 종목
let 켠=null;                // "종목|세트|칸"  (칸: s w r t)
let 열때=null, 친글=null, 옛=null, 타이머=null;
let 링크열림=null;          // 참고 링크 칸이 열린 종목
let 새줄=null;              // 방금 들어온 세트 줄 "j|k" — 한 번만 애니메이션
let 물음=null;              // 마지막 세트를 뺄 때 묻는 시트 (종목 번호)
let 지움되돌림=null;        // 종목을 뺀 직후 5초 되돌리기
// 운동 중 · 타이트하게
let 타이트={열림:false, 세트:true, 휴식:true, 마지막:false};
// 볼륨 자동 올리기
let 볼륨={켬:true, 방식:"%", 값:2.5, 배분:"무게", 언제:"성공"};

const 이름={s:"세트",w:"무게",r:"횟수",t:"휴식"},단위={s:"",w:"kg",r:"회",t:""},간={w:1,r:1,t:5};   // − ＋ 는 무게 1kg (09-24 메모)
// 휠: 무게 5kg · 횟수 1회 · 휴식 10초 (09-24 메모)
const 휠값={w:Array.from({length:61},(_,i)=>i*5),r:Array.from({length:50},(_,i)=>i+1),t:Array.from({length:19},(_,i)=>i*10)};
const 휠글={w:무글,r:String,t:분초};
const 총세트=()=>종목.reduce((a,e)=>a+e.세트.length,0);
const 예상분=()=>Math.round(종목.reduce((a,e)=>a+e.세트.reduce((b,s)=>b+40+s.t,0),0)/60)+ (종목.length-1);
const 볼륨값=e=>e.세트.reduce((a,s)=>a+s.w*s.r,0);
const 최고RM=e=>Math.max(...e.세트.map(s=>일RM(s.w,s.r)));
const 루틴성장=()=>Math.round(종목.reduce((a,e)=>a+e.성장*볼륨값(e),0)/종목.reduce((a,e)=>a+볼륨값(e),0));

/** 받침에 따라 을/를 · 은/는 */
function 조사(말, 받침, 없음){ const c=말.charCodeAt(말.length-1); const 받=(c>=0xAC00&&c<=0xD7A3)&&((c-0xAC00)%28!==0); return 말+(받?받침:없음) }
function 알림(t,닫기글="닫기"){ 지움되돌림 = 닫기글==="되돌리기" ? 지움되돌림 : null;$("toastT").textContent=t;$("toastX").textContent=닫기글;$("toast").hidden=false;clearTimeout(타이머);타이머=setTimeout(()=>{$("toast").hidden=true},4000)}
function 성장글(n){return n===0?`0%`:`${n>0?"▲":"▼"}${Math.abs(n)}%`}
function 성장클(n){return n>0?"up":n<0?"down":""}

// ── 숫자 칸 ──
function 칸(ji,ki,칸이름,값,현재){
  const 키=`${ji}|${ki}|${칸이름}`;
  if(켠!==키) return `<button class="k${칸이름==="s"?" 세트칸":칸이름==="r"?" 횟수칸":""}" data-open="${키}"><small>${칸이름==="s"?"세트":이름[칸이름]}</small><span>${값}</span></button>`;
  const 보임 = 친글!==null ? 친글+단위[칸이름] : 값;
  return `<div class="k on${칸이름==="s"?" 세트칸":칸이름==="r"?" 횟수칸":칸이름==="t"?" 휴식칸":""}"><button class="pm" data-pm="-" data-key="${키}" aria-label="${이름[칸이름]} 빼기">−</button>
    <div class="mid"><small>${이름[칸이름]}</small><span class="val">${보임}</span></div>
    <button class="pm" data-pm="+" data-key="${키}" aria-label="${이름[칸이름]} 더하기">＋</button></div>`;
}
function 휠그리기(ji,ki){
  if(!켠) return "";
  const [j,k,칸이름]=켠.split("|");
  if(+j!==ji||+k!==ki||칸이름==="s") return "";
  const 값들=휠값[칸이름], 지금=종목[ji].세트[ki][칸이름];
  const 가까운=값들.reduce((a,v,i)=>Math.abs(v-지금)<Math.abs(값들[a]-지금)?i:a,0);
  const 목록=값들.map((v,i)=>`<button class="wv${i===가까운?" on":""}" data-pick="${v}">${휠글[칸이름](v)}</button>`).join("");
  const 앞=["s","w","r","t"].indexOf(칸이름);
  return `<div class="wheelrow">${["s","w","r","t"].map((x,i)=>i===앞
    ?`<div class="wheel" id="wheel" style="flex:${칸이름==="r"?"1.6":칸이름==="t"?"1.51":"1.69"}">${목록}</div>`
    :`<div style="flex:${x==="s"?".75":x==="r"?".85":"1"}"></div>`).join("")}<div style="width:14px;flex:none"></div></div>`;
}
function 세트줄(ji){
  const e=종목[ji];
  return `<div class="box">`+e.세트.map((s,ki)=>

/** 세트 한 줄 빼기 — − 도 휴지통도 바로 지운다 (09-24 메모: 사라지는 움직임은 없앰) */
function 줄빼기(j,i,켠유지){

function 더하기(키,d){
  const [j,k,칸이름]=키.split("|"); const e=종목[+j];

      친글=null; 그리기(); 새줄=null; return;

    줄빼기(+j, i, true);

  const s=e.세트[+k];

}

  if(d.pm){ 더하기(d.key, d.pm==="+"?1:-1); return }

        if(!isNaN(n)) 종목[+j].세트[+k][칸이름] = 칸이름==="r"?Math.max(1,Math.round(n)):n; }
      닫기(); return;
