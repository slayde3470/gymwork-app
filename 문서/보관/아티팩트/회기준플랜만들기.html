<title>회 기준 플랜 만들기</title>
<style>
/* 레이아웃: 눌러 보는 폰 하나 + 옆에 설명. 색·글자 규격은 앱 Theme.kt 와 같다 */
:root{

  --밴드1:#06304F; --밴드2:#0A5490;   /* 훈련 방식 밴드 — 중심색 하나로 통일 */

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --글:#E5F0FA; --흐림:#C5D1DB; --옅음:#9BA7B3;
  --강조:#7FB3E6; --강조글:#04213D; --강조옅음:#1F3246;
  --좋음:#9BE06B; --좋음옅음:#1E3313; --나쁨:#E57368; --경고:#E8C271; --경고옅음:#33280F;
  --밴드1:#0A3A5E; --밴드2:#11649F; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --바탕:#07121E; --면:#111F2E; --면2:#172738; --선:#253A50; --속선:#37526E;
  --글:#E5F0FA; --흐림:#C5D1DB; --옅음:#9BA7B3;
  --강조:#7FB3E6; --강조글:#04213D; --강조옅음:#1F3246;
  --좋음:#9BE06B; --좋음옅음:#1E3313; --나쁨:#E57368; --경고:#E8C271; --경고옅음:#33280F;
  --밴드1:#0A3A5E; --밴드2:#11649F; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--바탕);color:var(--글);font-family:var(--본);margin:0}
.랩{padding-inline:16px;padding-block:20px 48px;max-width:1180px;margin:0 auto}

.줄{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}

.칩.on{background:var(--강조);color:var(--강조글);border-color:var(--강조);font-weight:700}

.체크{display:flex;align-items:flex-start;gap:6px;font-size:12px;color:var(--흐림);cursor:pointer;line-height:1.4}

.방목록{display:flex;flex-direction:column;gap:2px}
.방행{position:relative;overflow:hidden;border:none;padding:0;width:100%;font-family:inherit;cursor:pointer;text-align:left;
      background:linear-gradient(103deg, var(--밴드1) 0%, var(--밴드1) 44%, var(--밴드2) 100%);display:block}

.듦{animation:듦 .34s cubic-bezier(.22,.61,.36,1) both}

.블머리{width:100%;border:none;background:var(--면2);font-family:inherit;color:var(--글);cursor:pointer;
        display:flex;align-items:center;gap:6px;padding:7px 9px;font-size:11.5px;font-variant-numeric:tabular-nums;
        border-bottom:1px solid var(--속선)}

.표{width:100%;border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums}

.표 td{text-align:right;padding:4px 5px;border-bottom:1px solid var(--면2)}
.표 tr.측 td{background:var(--강조옅음);font-weight:700}
.그래프{height:70px;display:flex;align-items:flex-end;gap:1px}
.그래프 i{flex:1;background:var(--강조옅음);border-top:2px solid var(--강조);border-radius:2px 2px 0 0;min-width:1px}
.그래프 i.측{background:var(--강조);border-top-color:var(--강조)}

.팝업{width:100%;max-height:100%;background:var(--면);border:2px solid var(--강조);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.팝업.좁{max-width:300px}
.팝업.꽉{height:100%}
.팝머리{min-height:40px;background:var(--강조);color:var(--강조글);display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:15px;font-weight:700;flex:0 0 auto}
.팝몸{flex:1 1 auto;min-height:0;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:9px}
.팝몸.빈{padding:0;gap:0}
.팝발{border-top:1px solid var(--선);padding:10px 12px;display:flex;gap:8px;flex:0 0 auto}
.띠{border:2px solid var(--강조);border-radius:10px;padding:9px;display:flex;flex-direction:column;gap:5px;background:var(--강조옅음)}
.띠줄{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-variant-numeric:tabular-nums}
.띠줄 b{font-size:15px}
.알약{font-size:9px;font-weight:700;border:1px solid var(--속선);border-radius:4px;padding:1px 5px;color:var(--강조);white-space:nowrap}
.목박스{font-size:9px;font-weight:700;background:var(--강조);color:var(--강조글);border-radius:4px;padding:1px 5px;white-space:nowrap}
/* 계산 중 */
.로딩{position:absolute;inset:0;background:var(--강조);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:8}
.로딩 b{color:#fff;font-size:16px}
.봉{animation:봉 1.1s ease-in-out infinite alternate}
@keyframes 봉{from{transform:translateX(-26px) rotate(-6deg)}to{transform:translateX(26px) rotate(6deg)}}
@media (prefers-reduced-motion:reduce){.봉,.듦,.듦2,.듦3,.듦4{animation:none!important}}
/* 종목 탭 */
.평{border-bottom:1px solid var(--면2);padding:9px 10px;display:flex;align-items:center;gap:6px;font-size:15px}
.플줄{border:2px solid var(--강조);border-radius:10px;background:var(--강조옅음);padding:8px 9px;margin:6px}
.플머리{display:flex;align-items:center;gap:5px;font-size:13px;white-space:nowrap;cursor:pointer;background:none;border:none;
        font-family:inherit;color:var(--글);width:100%;padding:0;text-align:left}
.플머리 b{overflow:hidden;text-overflow:ellipsis;min-width:0}
.큰게이지{height:20px;border-radius:10px;background:var(--면2);border:1px solid var(--속선);margin-top:7px;position:relative;overflow:hidden}

                 font-size:11px;font-weight:700;color:var(--글);font-variant-numeric:tabular-nums;
                 text-shadow:0 0 3px var(--면),0 0 3px var(--면)}
.가로줄{border-top:1px solid var(--속선);margin-top:8px}

.타일 .밑{font-size:9px;color:var(--옅음);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.작게이지{height:4px;border-radius:2px;background:var(--면2);overflow:hidden}
.작게이지 span{display:block;height:100%;background:var(--강조)}
.한줄{display:flex;justify-content:space-between;font-size:11px;color:var(--흐림);margin-top:7px}

.세줄{display:flex;align-items:center;gap:8px;border:1px solid var(--속선);border-radius:8px;padding:7px 8px;font-size:13px;position:relative;background:var(--면)}
.세줄.워{background:var(--좋음옅음);border-color:var(--좋음)}
.세줄.측{background:var(--강조옅음);border-color:var(--강조)}
.박{width:22px;height:22px;border-radius:5px;border:2px solid var(--속선);flex:0 0 auto;background:var(--면)}
.세줄.워 .박{border-color:var(--좋음)}
.세줄.측 .박{border-color:var(--강조)}
.딱지{position:absolute;top:-6px;left:12px;font-size:7.5px;font-weight:700;border-radius:3px;padding:0 3px;white-space:nowrap;background:var(--좋음);color:#fff;line-height:1.5}
.세줄.측 .딱지{background:var(--강조);color:var(--강조글)}
.볼륨줄{display:flex;justify-content:space-between;font-size:12px;padding:8px;border-radius:8px;background:var(--면2);border:1px solid var(--속선);font-variant-numeric:tabular-nums}
.토스트{position:absolute;left:12px;right:12px;bottom:56px;background:var(--강조);color:var(--강조글);border-radius:8px;padding:9px 11px;font-size:12px;z-index:9;text-align:center}
.복귀띠{background:var(--경고옅음);border-bottom:1px solid var(--경고);padding:7px 10px;font-size:12px;display:flex;align-items:center;gap:8px;flex:0 0 auto}

</style>

<div class="랩">
  <h1>회 기준 플랜 만들기</h1>
  <p class="안내">모든 칸이 비어 있습니다. 종목을 고르고 직접 넣어 보세요. <strong>훈련 방식</strong> 칸을 누르면 방식 목록이 한 화면에 뜹니다. 실행하면 종목 탭에 플랜 종목이 생기고, 거기서 <strong>운동 중 화면</strong>과 <strong>워밍업 세트(beta)</strong> 까지 볼 수 있습니다.</p>

</div>

<script>

const 종목들 = [

const ep   = (w,r) => r<=1 ? w : w*(1+r/30);
const 되ep = (rm,r) => r<=1 ? rm : rm/(1+r/30);
const kg   = v => (Math.round(v*10)/10).toString().replace(/\.0$/,"");
const 콤마 = v => Math.round(v).toLocaleString("ko-KR");
const 내림 = (v,폭) => Math.max(폭, Math.round(v/폭)*폭);
/* kg 으로 통일. 박스를 넘칠 만큼 커지면 t 로 */
const 운동량글 = v => v >= 1e6 ? (v/1e6).toFixed(1)+"kt" : v >= 100000 ? (v/1000).toFixed(1)+"t" : 콤마(v)+"kg";
const 포화 = f => (1 - Math.exp(-f/2)) / (1 - Math.exp(-1));
const 빈도배수 = (f, 부위) => 1 + 빈도세기[부위] * (포화(f) - 1);
const 수준 = (경계, rm, 체중) => { const x = rm/체중;
  return x<경계[0]?"입문":x<경계[1]?"초급":x<경계[2]?"중급":x<경계[3]?"고급":"상급"; };

function 계산(종목, 지금1RM, 목표1RM, f, 체중){
  const rows = [];
  if (!(지금1RM>0) || !(목표1RM>지금1RM)) return {rows, 회:0, 주:0, 넘음:목표1RM>0 && 목표1RM<=지금1RM};
  let v = 지금1RM, n = 0;
  while (v < 목표1RM && n < 플랜표.최대회){
    n++;
    const L = 수준(종목.경계, v, 체중);
    const 넉주 = 플랜표.기대속도[L] * 종목.배수 * 빈도배수(f, 종목.부위);
    v *= (1 + Math.pow(1 + 넉주/100, 1/(4*f)) - 1);
    const 간격 = Math.max(1, Math.round(플랜표.측정주기[L]*f));
    rows.push({회:n, 주:Math.ceil(n/f), rm:v, 수준:L, 측정일: n % 간격 === 0});
  }
  return {rows, 회:n, 주:Math.ceil(n/f), 넘음:false};
}
/** 측정일 워밍업 — NSCA 절차 수준 (총 9회) */
const 측정워밍업 = (W,폭) => [[0.40,5],[0.60,3],[0.90,1]].map(([p,r]) => ({무게:내림(W*p,폭), 횟수:r}));
/** 보통 날 워밍업 — 사용자가 1~5세트 중 고른 만큼만 (beta) */
const 보통워밍업표 = {
  1:[[0.60,5]],
  2:[[0.50,5],[0.75,3]],
  3:[[0.40,5],[0.60,3],[0.80,2]],
  4:[[0.40,5],[0.55,5],[0.70,3],[0.85,2]],
  5:[[0.35,5],[0.50,5],[0.65,3],[0.75,3],[0.85,2]],
};
const 보통워밍업 = (W,n,폭) => (보통워밍업표[n]||[]).map(([p,r]) => ({무게:내림(W*p,폭), 횟수:r}));

function 경고(f, 부위){
  const 배 = x => 빈도배수(x, 부위);
  const pp = x => Math.round((배(x) - 배(x-1)) * 100);
  if (f === 1) return `주 1회도 운동 효과가 분명히 있지만, ${근("향상 속도가 절반 정도로 느려질 수 있습니다","schoenfeld16")}.`;
  if (f === 2) return "";
  if (f === 3) return `주 3회는 흔히 권장되는 범위이지만, <b>휴식과 컨디션 조절에 능숙한 경우에만</b> 권장합니다.`;
  if (f === 4) return `운동 횟수를 늘리면 근력은 좋아지지만 ${근("얻을 수 있는 효율이 줄어듭니다","pelland")}. 운동 횟수를 주 4회로 늘려 얻는 추가적인 이득은 <b>+${pp(4)}%</b> 정도입니다. 휴식과 컨디션 조절에 유의해야 합니다.`;
  if (f === 5) return `운동 횟수를 주 5회로 늘려 얻는 추가적인 이득이 <b>+${pp(5)}%</b> 정도로 현저히 줄어듭니다. 휴식과 컨디션 조절이 매우 어렵습니다.`;
  if (f === 6) return `운동 횟수를 주 6회로 늘려 얻는 추가적인 이득이 단 <b>+${pp(6)}%</b> 이며, 회복이 따라오지 못하면 지속적인 피로와 근육통이 나타날 수 있습니다.`;
  return `운동 횟수를 주 7회로 늘려 얻는 추가적인 이득은 단 <b>+${pp(7)}%</b> 뿐입니다. <b>쉬는 날이 하루도 없다는 뜻입니다.</b> 이 정도를 실제로 지켜 낸 사례는 연구에서도 드뭅니다. 회복이 따라오지 못하면 ${근("지속적인 피로와 근육통이 먼저 나타나고, 최대근력은 가장 나중에 떨어집니다","meeusen")}. 정말 주 7회까지 필요한지 한 번 더 생각해 보세요.`;
}

const 몸 = () => (S.설정.나이 > 0 && S.설정.체중 > 0) ? S.설정 : null;
const 체중 = () => (몸() ? 몸().체중 : 73);
const 고른종목 = () => 종목들.find(x => x.이름 === S.고른);

const 강도 = () => 강도들.find(x => x.키 === S.강도);
const 수 = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const 기본무게 = e => { const b = 플랜표.기본무게[e.장비]; return b === null ? 체중() : b; };
function 현재1RM(){ const e = 고른종목(); if (!e) return 0;
  if (S.안넣기) return 기본무게(e);
  return S.현재방식 === "1RM" ? 수(S.현rm) : (수(S.현w)>0 && 수(S.현r)>0 ? ep(수(S.현w), 수(S.현r)) : 0); }
const 목표1RM = () => S.목표방식 === "1RM" ? 수(S.목rm) : (수(S.목w)>0 && 수(S.목r)>0 ? ep(수(S.목w), 수(S.목r)) : 0);
const 목표글 = () => S.목표방식 === "1RM" ? `1RM ${kg(수(S.목rm))}kg` : `${kg(수(S.목w))}kg × ${수(S.목r)}회`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function 빠른예상(){ const e = 고른종목(); if (!e || !몸()) return null;
  const r = 계산(e, 현재1RM(), 목표1RM(), S.f, 체중()); return r.rows.length ? r : null; }

function 결과팝업(){

    if (!열림) return 머리;
    return 머리 + `<table class="표"><thead><tr><th>회</th><th>주</th><th>목표1RM</th><th>처방</th></tr></thead>

        <td>${x.측정일?"측정 + ":""}${처방(x.rm).요약}</td></tr>`).join("")}</tbody></table>`;
  }).join("")}</div>`;
}
function 처방(T){
  const m = 방식();

  const 요약 = 목.length === 1 ? `${kg(목[0].무게)}kg × ${목[0].횟수}회 × ${목[0].세트}세트`

function 종목화면(){

    ${열림 ? `<div class="가로줄"></div>
      <div class="여축"><span class="찬" style="width:${진행*100}%"></span>
        <span class="점" style="left:${진행*100}%"></span><span class="끝"></span></div>
      <div class="여글"><span>시작 ${kg(p.시작)}kg</span><span>현재 <b style="color:var(--강조)">${kg(p.지금)}kg</b></span><span>목표 ${kg(p.목표)}kg</span></div>
      <div class="타일줄">
        ${타일(p.성공 + "회차", 콤마(남은회) + "회차 남음", p.성공/p.총회)}
        ${타일(운동량글(p.볼륨), "누적 운동량", p.볼륨/p.예상총볼륨)}
        ${타일(콤마(남은주) + "주 남음", "누적 " + p.주차 + "주", p.주차/(p.주차+남은주))}
      </div>
      <div class="한줄"><span>다음 측정일</span><span><b>${p.다음측정 - p.성공}회차 후</b> 예정 (${p.다음측정}회차)</span></div>
      <div class="단추줄" style="margin-top:8px"><button class="단추" data-운동="${i}">운동 시작해 보기</button></div>
    ` : ""}
  </div>`;
}

/* ─── 운동 중 ─── */
function 운동화면(){
  const p = S.플랜들[S.운동]; if (!p) return "";
  const 측 = S.측정일보기, W = p.본무게, R = p.본횟수, 세트수 = p.본세트;
  const 업 = 측 ? 측정워밍업(W, 플랜표.무게폭) : (S.워밍업켬 ? 보통워밍업(W, S.워밍업수, 플랜표.무게폭) : []);
  const 본볼륨 = W * R * 세트수;
  const 뺀볼륨 = 업.reduce((a,x)=>a + x.무게*x.횟수, 0) + (측 ? W*5 : 0);
  return `<div class="덮개"><div class="팝업 꽉">
    <div class="팝머리">${esc(p.이름)} <span style="margin-left:auto;font-size:11px;font-weight:400">운1</span></div>
    <div class="팝몸">
      <div class="칩줄 한줄">
        <button class="칩 빈도 ${측?"on":""}" data-측정일="1">측정일</button>
        <button class="칩 빈도 ${측?"":"on"}" data-측정일="0">보통 날</button>
      </div>
      ${측 ? "" : `<div class="단추줄"><button class="단추 ${S.워밍업켬?"주":""}" id="워밍업켜기">워밍업 세트 ${S.워밍업켬?"끄기":"추가"}<span class="베타">beta</span></button></div>
        ${S.워밍업켬 ? `<div class="라벨">몇 세트 추가할까요</div>
          <div class="칩줄 한줄">${[1,2,3,4,5].map(n=>`<button class="칩 빈도 ${S.워밍업수===n?"on":""}" data-워밍업수="${n}">${n}세트</button>`).join("")}</div>
          <div class="메모">본 세트 <b>${kg(W)}kg</b> 을 기준으로 자동 계산했습니다. 부상 예방이 목적이라 무게만 정하고 횟수는 줄여 둡니다.</div>` : ""}`}
      ${업.map(x => `<div class="세줄 워"><span class="박"></span><span class="딱지">워밍업</span><span>${kg(x.무게)}kg × ${x.횟수}회</span></div>`).join("")}
      ${측 ? `<div class="세줄 측"><span class="박"></span><span class="딱지">측정</span><span>${kg(W)}kg × 최대 반복</span>
        <span style="margin-left:auto;font-size:10px;color:var(--옅음)">1RM 기록에</span></div>` : ""}
      ${Array.from({length:세트수}, (_,i) => `<div class="세줄"><span class="박"></span><span>${kg(W)}kg × ${R}회</span>
        <span style="margin-left:auto;font-size:11px;color:var(--옅음)">${i+1} / ${세트수}</span></div>`).join("")}
      <div class="볼륨줄"><span>오늘 볼륨</span><b>${콤마(본볼륨)}kg</b></div>
      ${뺀볼륨 ? `<div class="메모">워밍업${측?" · 측정 세트":""}는 <b>볼륨에 들어가지 않습니다</b> — 넣으면 ${콤마(본볼륨+뺀볼륨)}kg 이 되어 운동량이 부풀어 보입니다.</div>` : ""}
      ${측 ? `<div class="메모">측정일 워밍업은 총 ${업.reduce((a,x)=>a+x.횟수,0)}회입니다. 워밍업은 기록에 남지 않고, 측정 세트는 볼륨에서는 빠지지만 <b>1RM 기록에는 들어갑니다</b>.</div>`
           : `<div class="메모">보통 날 워밍업은 <b>앱이 처방하지 않습니다</b> — ${근("10RM 부하에서는 워밍업을 해도 안 해도 차이가 없었습니다","생략")}. 필요하면 위 버튼으로 켜세요.</div>`}
    </div>
    <div class="팝발"><button class="단추" data-닫기운동="1">닫기</button></div></div></div>`;
}

/* ─── 이벤트 ─── */
function 묶기(){
  const q = (s,f) => document.querySelectorAll(s).forEach(f);
  const 글자 = (id, 넣기) => { const el = document.getElementById(id); if(!el) return;
    el.addEventListener("input", () => 넣기(el.value));
    el.addEventListener("change", () => 그리기()); };

  q(".탭", b => b.onclick = () => { const t = b.dataset.탭;
    if (S.돌아갈곳 && t === S.돌아갈곳) S.돌아갈곳 = null;
    S.탭 = t; S.팝업 = null; S.근거키 = null; 그리기(); });
  const back = document.getElementById("뒤로");
  if (back) back.onclick = () => { S.탭 = S.돌아갈곳; S.돌아갈곳 = null; 그리기(); };
  const g = document.getElementById("고르기");
  if (g) g.addEventListener("change", () => { S.고른 = g.value; 그리기(); });
  const an = document.getElementById("안넣기");
  if (an) an.onclick = () => { S.안넣기 = !S.안넣기; 그리기(); };
  const sb = document.getElementById("설정빔");
  if (sb) sb.addEventListener("change", () => {
    S.설정 = sb.checked ? {나이:0, 남:S.설정.남, 체중:0} : {나이:35, 남:S.설정.남, 체중:109}; 그리기(); });
  const 가 = document.getElementById("설정가기");
  if (가) 가.onclick = () => { S.돌아갈곳 = "플랜"; S.탭 = "설정"; 그리기(); };

  q("[data-현방식]", b => b.onclick = () => { S.현재방식 = b.dataset.현방식; S.안넣기 = false; 그리기(); });
  q("[data-목방식]", b => b.onclick = () => { S.목표방식 = b.dataset.목방식; 그리기(); });
  q("[data-빈도]",   b => b.onclick = () => { S.f = +b.dataset.빈도; S.블록 = null; 그리기(); });
  q("[data-성별]",   b => b.onclick = () => { S.설정.남 = b.dataset.성별 === "남"; 그리기(); });
  q("[data-방펼침]", b => b.onclick = () => { const n = +b.dataset.방펼침; S.방펼침 = S.방펼침===n ? null : n; S.방식 = n; 그리기(); });
  q("[data-블록]",   b => b.onclick = () => { const i = +b.dataset.블록; S.블록 = S.블록===i ? null : i; 그리기(); });
  q("[data-근거]",   b => b.onclick = ev => { ev.stopPropagation(); S.근거키 = b.dataset.근거; 그리기(); });
  q("[data-닫기]",   b => b.onclick = () => { S.팝업 = null; S.방펼침 = null; 그리기(); });
  q("[data-닫기운동]", b => b.onclick = () => { S.운동 = null; 그리기(); });
  q("[data-플랜]",   b => b.onclick = () => { const i = +b.dataset.플랜; S.펼친 = S.펼친===i ? null : i; 그리기(); });
  q("[data-운동]",   b => b.onclick = () => { S.운동 = +b.dataset.운동; 그리기(); });
  q("[data-측정일]", b => b.onclick = () => { S.측정일보기 = b.dataset.측정일 === "1"; 그리기(); });
  q("[data-워밍업수]", b => b.onclick = () => { S.워밍업수 = +b.dataset.워밍업수; 그리기(); });
  const wu = document.getElementById("워밍업켜기");
  if (wu) wu.onclick = () => { S.워밍업켬 = !S.워밍업켬; 그리기(); };
  const 근닫 = document.getElementById("근거닫기");
  if (근닫) 근닫.onclick = () => { S.근거키 = null; 그리기(); };

  ["현rm","현w","현r","목rm","목w","목r"].forEach(id => 글자(id, v => { S[id] = v; }));
  const 설입력 = (id, 넣기) => { const el = document.getElementById(id); if(!el) return;
    el.addEventListener("input", () => 넣기(수(el.value)));
    el.addEventListener("change", () => 그리기()); };
  설입력("설나이", v => S.설정.나이 = v);  설입력("설체중", v => S.설정.체중 = v);
  const 저장 = document.getElementById("저장가기");
  if (저장) 저장.onclick = () => { if (!몸()){ 알림("나이와 체중을 넣어 주세요"); return; }
    S.탭 = S.돌아갈곳; S.돌아갈곳 = null; 그리기(); };

  const 방열 = document.getElementById("방식열기");
  if (방열) 방열.onclick = () => { S.팝업 = "방식"; S.방펼침 = null; 그리기(); };
  const 방고 = document.getElementById("방식고름");
  if (방고) 방고.onclick = () => { S.팝업 = null; S.방펼침 = null; 알림(방식().이름 + " 로 정했습니다"); 그리기(); };

  const c = document.getElementById("계산");
  if (c) c.onclick = () => {
    if (!(현재1RM()>0)){ 알림("수행능력을 넣어 주세요"); return; }
    if (!(목표1RM()>0)){ 알림("목표를 넣어 주세요"); return; }
    S.계산중 = true; S.블록 = null; 그리기();
    setTimeout(() => { S.계산중 = false; S.팝업 = "결과"; 그리기(); }, 1700); };
  const im = document.getElementById("이미지");
  if (im) im.onclick = () => 알림("갤러리에 PNG 로 저장합니다 (앱에서 동작)");
  const ex = document.getElementById("실행");
  if (ex) ex.onclick = () => { S.이름 = S.고른; S.팝업 = "이름"; 그리기(); };
  const nm = document.getElementById("이름칸");
  if (nm) nm.addEventListener("input", () => { S.이름 = nm.value; });
  const ok = document.getElementById("확정");
  if (ok) ok.onclick = 만들기;
}

function 만들기(){
  const e = 고른종목(), 시작 = 현재1RM(), 목표 = 목표1RM();
  const r = 계산(e, 시작, 목표, S.f, 체중());
  if (!r.rows.length){ 알림("계산할 수 없습니다"); return; }
  const 성공 = Math.min(12, r.rows.length), 주차 = Math.ceil(성공/S.f);
  const 지금 = r.rows[성공-1].rm;
  const 다음i = r.rows.findIndex((x,i) => i >= 성공 && x.측정일);
  const 처 = 처방(r.rows[Math.min(성공, r.rows.length-1)].rm), 본 = 처.목[0];
  const 회볼륨 = 처.목.reduce((a,x)=>a + x.무게 * (parseInt(x.횟수)||1) * x.세트, 0);
  S.플랜들.unshift({
    이름: S.이름 || S.고른, 목표글: 목표글(), 시작, 지금, 목표, 성공, 총회: r.회, 주차, f: S.f,
    다음측정: 다음i >= 0 ? r.rows[다음i].회 : r.회,
    본무게: 본.무게, 본횟수: parseInt(본.횟수) || 5, 본세트: 본.세트,
    볼륨: Math.round(회볼륨 * 성공 * 0.94), 예상총볼륨: Math.round(회볼륨 * r.회 * 1.25),
  });
  S.팝업 = null; S.탭 = "종목"; S.펼친 = 0;
  알림("종목 탭에 플랜 종목을 만들었습니다"); 그리기();
}
let 시계;
function 알림(t){ S.토스트 = t; clearTimeout(시계);
  시계 = setTimeout(() => { S.토스트 = ""; 그리기(); }, 2400); }
