<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>하젠하이데 7일 체험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 위에 '7일 체험' 막대, 그 아래 휴대폰 한 화면(앱과 같은 탭 · 시트 · 고정 띠). 색·크기는 앱의 Theme.kt 그대로 */
:root{
  --바탕:#F8FAFB; --면:#FFFFFF; --면2:#F0F4F8; --선:#D3DFE9; --속선:#B5C9DA;
  --글:#000000; --흐림:#35495B; --옅음:#5E6B77;
  --강조:#084B83; --강조글:#FFFFFF; --강조옅음:#E1E9F0;
  --좋음:#4C9A1F; --좋음글:#FFFFFF; --좋음옅음:#EAF3E4; --근육:#D6DDD9; --피부:#B9C3BE; --결:#AEB9B3; --나쁨:#B3261E; --연두:#7CB342;
  --체험:#1d2a36; --체험글:#E9F0F6;
  --글꼴: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r-작게:8px; --r-보통:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --바탕:#07121E; --면:#111F2E; --면2:#172738; --선:#253A50; --속선:#37526E;
  --글:#E5F0FA; --흐림:#C5D1DB; --옅음:#9BA7B3; --강조:#7FB3E6; --강조글:#04213D; --강조옅음:#1F3246;
  --좋음:#9BE06B; --좋음글:#0B2A10; --좋음옅음:#243A22; --근육:#4A5550; --피부:#3A433F; --결:#39423E; --나쁨:#E57368; --연두:#9BE06B; --체험:#0c1620; --체험글:#C5D1DB; color-scheme:dark }}
:root[data-theme="dark"]{
  --바탕:#07121E; --면:#111F2E; --면2:#172738; --선:#253A50; --속선:#37526E;
  --글:#E5F0FA; --흐림:#C5D1DB; --옅음:#9BA7B3; --강조:#7FB3E6; --강조글:#04213D; --강조옅음:#1F3246;
  --좋음:#9BE06B; --좋음글:#0B2A10; --좋음옅음:#243A22; --근육:#4A5550; --피부:#3A433F; --결:#39423E; --나쁨:#E57368; --연두:#9BE06B; --체험:#0c1620; --체험글:#C5D1DB; color-scheme:dark }
html,body{height:100%}
body{background:var(--바탕);color:var(--글);font-family:var(--글꼴);font-size:15px;letter-spacing:-0.01em;padding-inline:16px;padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--강조);outline-offset:2px}
input{font:inherit;color:var(--글)}
.틀{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:10px;height:100%}
/* ── 7일 체험 막대 ── */
.체험{background:var(--체험);color:var(--체험글);border-radius:var(--r-보통);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.체험 .윗{display:flex;align-items:center;gap:8px}
.체험 .윗 b{font-size:15px;color:#fff;flex:1;min-width:0}
.체험 .날들{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.체험 .날들 button{border:1px solid #ffffff33;border-radius:8px;padding:4px 0;font-size:11px;line-height:1.25;color:var(--체험글)}
.체험 .날들 button.켬{background:#fff;color:#084B83;font-weight:700}
.체험 .날들 button.지남{opacity:.55}
.체험 small{font-size:11px;opacity:.8}
.체험 .작은{font-size:11px;border:1px solid #ffffff44;border-radius:8px;padding:2px 7px;color:var(--체험글)}
/* ── 휴대폰 한 화면 ── */
.폰{flex:1;min-height:560px;max-height:860px;background:var(--바탕);border:1px solid var(--선);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.화면{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.넘김{overflow-y:auto;min-height:0;flex:1;padding:0 12px 12px}
.탭줄{display:flex;background:var(--면);border-top:1px solid var(--선);padding-bottom:env(safe-area-inset-bottom,0px)}
.탭줄 button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 8px;font-size:11px;color:var(--흐림);font-weight:500}
.탭줄 button.켬{color:var(--강조);font-weight:700}
.탭줄 svg{width:18px;height:18px}
h1{font-size:22px;font-weight:700;letter-spacing:-0.02em;margin:14px 0 8px;text-wrap:balance}
.카드{background:var(--면);border:2px solid var(--강조);border-radius:var(--r-보통);padding:12px}
.카드.빈{padding:0}
.쌓기{display:flex;flex-direction:column;gap:8px}
.줄{display:flex;align-items:center;gap:8px;min-width:0}
.채움{flex:1;min-width:0}
.작{font-size:13px}.아주작{font-size:11px}.큰{font-size:18px}.굵{font-weight:700}
.흐림{color:var(--흐림)}.옅음{color:var(--옅음)}.강조{color:var(--강조)}.나쁨{color:var(--나쁨)}.좋음{color:var(--좋음)}
.숫{font-variant-numeric:tabular-nums}
.한줄{white-space:nowrap;overflow:hidden}
.맞춤{white-space:nowrap;letter-spacing:-0.04em}
.버튼{height:40px;border-radius:var(--r-작게);border:1px solid var(--속선);background:var(--면);font-weight:600;font-size:13px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.버튼.주{background:var(--강조);color:var(--강조글);border-color:var(--강조)}
.버튼.낮{height:32px}
.버튼.넓{width:100%}
.버튼.나쁨{color:var(--나쁨)}
.칩{height:28px;border-radius:var(--r-작게);border:1px solid var(--속선);padding:0 10px;font-size:13px;display:inline-flex;align-items:center}
.칩.켬{background:var(--강조);color:var(--강조글);border-color:var(--강조);font-weight:700}
.칩줄{display:flex;flex-wrap:wrap;gap:4px}
.고르기{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--선);width:100%;text-align:left}
.고르기 .곁{font-size:11px;color:var(--옅음);flex:1;min-width:0;white-space:nowrap;overflow:hidden;letter-spacing:-0.03em}
.입력{height:40px;border:1px solid var(--속선);border-radius:var(--r-작게);background:var(--면);padding:0 10px;width:100%;min-width:0}
label.칸{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--옅음);flex:1;min-width:0}
.구분{height:1px;background:var(--선)}
.알약{font-size:11px;font-weight:700;border-radius:8px;padding:1px 6px}
.알약.달성{background:var(--좋음옅음);color:var(--좋음)}
.알약.미달성{color:var(--나쁨);border:1px solid var(--나쁨)}
.알약.강조{background:var(--강조);color:var(--강조글)}
.번호{position:relative}
.번호[data-n]::before{content:attr(data-n);position:absolute;left:2px;top:2px;font-size:11px;font-weight:700;color:#fff;background:#1e6fd9;border-radius:8px;padding:0 3px;z-index:3;pointer-events:none}
.번호끔 .번호[data-n]::before{display:none}
/* ── 시트 ── */
.가림{position:absolute;inset:0;background:#0006;display:flex;align-items:flex-end;z-index:20}
.시트{background:var(--면);width:100%;max-height:88%;border-radius:16px 16px 0 0;padding:14px 14px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.시트 .머리{display:flex;align-items:center;gap:8px}
.시트 .머리 b{flex:1;font-size:18px}
.아래띠{position:absolute;left:10px;right:10px;bottom:62px;background:var(--흐림);color:var(--바탕);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:center;z-index:15;font-size:13px}
.아래띠 button{font-weight:700;color:var(--바탕);text-decoration:underline}
/* ── 캘린더 ── */
.띠{background:var(--강조);color:var(--강조글);min-height:40px;display:flex;align-items:center;gap:8px;padding:6px 12px}
.띠 b{font-size:18px}
.달력{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:4px 6px 6px;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.요일{font-size:11px;text-align:center;color:var(--옅음);padding:2px 0}
.칸날{height:56px;border-radius:8px;padding:3px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;position:relative;border:1px solid transparent}
.칸날 .일{font-size:13px;font-weight:600}
.칸날.오늘 .일{background:var(--강조);color:var(--강조글);border-radius:8px;padding:0 4px}
.칸날.고름{border-color:var(--강조);background:var(--강조옅음)}
.칸날 .루{font-size:11px;max-width:100%;overflow:hidden;white-space:nowrap;letter-spacing:-0.05em;border-radius:8px;padding:0 2px}
.칸날 .루.예{background:var(--강조옅음);color:var(--강조)}
.칸날 .루.휴{border:1px solid var(--속선);color:var(--옅음)}
.칸날 .상{font-size:11px;font-weight:700}
.칸날.놓기{background:var(--강조);color:var(--강조글)}
.칸날.못놓{border:2px solid var(--나쁨)}
.칸날.집음{outline:2px dashed var(--강조);opacity:.55}
.칸날.딴달{visibility:hidden}
.판{display:flex;flex-direction:column;gap:6px;padding:10px 12px}
.판줄{display:flex;gap:8px;align-items:center;border-top:1px solid var(--선);padding-top:6px}
.판줄 .이름{font-size:11px;color:var(--옅음);width:54px;flex:none}
/* ── 끌기 ── */
.끌림{opacity:.35}
.유령{position:fixed;z-index:50;pointer-events:none;background:var(--좋음);color:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;transform:translate(-50%,-140%)}
.선위{box-shadow:inset 0 3px 0 var(--강조)} .선아래{box-shadow:inset 0 -3px 0 var(--강조)} .선가운데{outline:2px solid var(--강조);outline-offset:-2px}
[data-drag]{touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* ── 운동 중 ── */
.머리줄{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--면);font-size:11px}
.머리줄 b{font-size:13px}
.고정띠{position:absolute;left:12px;right:12px;top:4px;z-index:5;border:2px solid var(--강조);border-radius:16px;overflow:hidden;background:var(--면)}
.고정띠 .띠{align-items:flex-start}
.고정띠 .이름{font-size:18px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.세트줄{display:grid;grid-template-columns:28px 1fr 1fr 64px 28px;gap:4px;align-items:center;padding:4px 0}
.세트줄.지금{background:var(--강조옅음);border-radius:8px}
.세트줄.워밍{box-shadow:inset 3px 0 0 var(--연두)}
.세트줄 .k{font-weight:700;text-align:center}
.값칸{display:flex;align-items:center;border:1px solid var(--속선);border-radius:8px;height:40px;overflow:hidden}
.값칸 button{width:28px;height:100%;color:var(--강조);font-weight:700}
.값칸 span{flex:1;text-align:center;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.체크{width:28px;height:28px;border-radius:50%;border:2px solid var(--속선);display:flex;align-items:center;justify-content:center}
.체크.켬{background:var(--강조);border-color:var(--강조);color:var(--강조글)}
.휴식칸{height:40px;border-radius:8px;border:1px solid var(--강조);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--강조)}
.휴식칸 i{position:absolute;inset:0;background:var(--강조);transform-origin:left}
.휴식칸 .밑{position:relative;color:var(--강조)}
.휴식칸 .위{position:absolute;inset:0;background:var(--강조);color:var(--강조글);display:flex;align-items:center;justify-content:center}
.종목상자{border:1px solid var(--속선);border-radius:16px;padding:8px;background:var(--면)}
.종목상자.지금{border:2px solid var(--강조)}
.아랫줄{display:flex;gap:8px;padding:8px 12px;background:var(--면);border-top:1px solid var(--선)}
.게이지{height:20px;border-radius:8px;background:var(--면2);border:1px solid var(--속선);position:relative;overflow:hidden}
.게이지 i{position:absolute;inset:0 auto 0 0;background:var(--강조)}
.게이지 span{position:relative;display:block;text-align:center;font-size:11px;font-weight:700;line-height:18px;mix-blend-mode:difference;color:#fff}
.가는바{height:8px;border-radius:4px;background:var(--면2);overflow:hidden}.가는바 i{display:block;height:100%;background:var(--강조)}
.방식띠{min-height:40px;border-radius:8px;background:linear-gradient(90deg,var(--강조),color-mix(in srgb,var(--강조) 82%,transparent));color:var(--강조글);display:flex;align-items:center;gap:6px;padding:6px 10px;width:100%;text-align:left}
.방식띠.골름{box-shadow:inset 0 0 0 3px var(--강조),inset 0 0 0 5.5px var(--강조글)}
.방식속{background:var(--면2);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.빈칸{border:1px dashed var(--속선);border-radius:8px;padding:14px;text-align:center;color:var(--옅음);font-size:13px}
.수칸{display:flex;align-items:center;gap:4px}
.수칸 button{width:28px;height:28px;border:1px solid var(--속선);border-radius:8px;font-weight:700}
.수칸 b{min-width:30px;text-align:center}
.토스트{position:absolute;left:50%;top:50px;transform:translateX(-50%);background:var(--흐림);color:var(--바탕);padding:6px 12px;border-radius:8px;font-size:13px;z-index:40;white-space:nowrap}
/* ── 운동 중 그림 칸 ── */
.배너{display:flex;gap:6px;padding:6px 12px 0;position:relative;flex:none;transition:height .35s cubic-bezier(.2,.8,.2,1)}
.그림판{flex:1;min-width:0;position:relative;background:var(--면);border:1px solid var(--선);border-radius:8px;overflow:hidden;display:flex}
.그림속{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:4px}
.그림속 svg{width:100%;height:100%;display:block}
.그림속 img{width:100%;height:100%;object-fit:cover;display:block}
.그림판:has(img) .그림속{padding:0}
.그림이름{position:absolute;left:6px;bottom:4px;font-size:11px;font-weight:700;color:var(--흐림);background:color-mix(in srgb,var(--면) 82%,transparent);padding:0 4px;border-radius:8px;max-width:calc(100% - 20px);white-space:nowrap;overflow:hidden}
.배너닫기{position:absolute;top:10px;right:16px;width:24px;height:24px;border-radius:50%;background:color-mix(in srgb,var(--면) 85%,transparent);font-size:11px;color:var(--흐림);z-index:2}
.더미{position:absolute;right:2px;top:8px;bottom:8px;display:flex;gap:1px;pointer-events:none}
.더미 i{width:3px;border-radius:50%;background:var(--속선);opacity:.75}
.사진없음{font-size:13px;color:var(--옅음);text-align:center;line-height:1.4}
.몸바탕{fill:var(--피부)} .몸결{fill:none;stroke:var(--결);stroke-width:.7;opacity:.8}
.몸근{stroke:var(--면);stroke-width:1.2;stroke-linejoin:round;transition:fill .6s ease}
/* ── 종목 사진 ── */
.종목줄{border-bottom:1px solid var(--선);padding:6px 0}
.종목줄:last-child{border-bottom:0}
.종목줄머리{width:100%;text-align:left}
.작은사진{width:28px;height:28px;border-radius:8px;object-fit:cover;flex:none}
.작은사진.빈{background:var(--면2);border:1px dashed var(--속선)}
.접힘표{transition:transform .25s}.접힘표.펼{transform:rotate(180deg)}
.종목펼속{display:flex;flex-direction:column;gap:6px;padding-top:8px}
.사진줄{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.사진추가,.사진칸{width:72px;height:72px;flex:none;border-radius:8px;position:relative;overflow:hidden}
.사진추가{border:1px dashed var(--속선);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--강조);font-size:22px;cursor:pointer;line-height:1.1}
.사진추가 small{font-size:11px;color:var(--흐림)}
.사진칸 img{width:100%;height:100%;object-fit:cover}
.지움표{position:absolute;inset:0;background:#000a;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
/* ── 움직임 (UI 동작 전부) ── */
button{transition:transform .12s ease, background-color .2s, color .2s, box-shadow .2s, opacity .2s}
button:active:not(:disabled){transform:scale(.96)}
.세트줄{transition:background-color .25s}
.게이지3 i{transition:width .7s cubic-bezier(.2,.8,.2,1)}
.휴식칸 i{transition:transform .25s linear}
@keyframes 스며{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes 올라옴{from{transform:translateY(100%)}to{transform:none}}
@keyframes 흐려짐{from{opacity:0}to{opacity:1}}
@keyframes 톡{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes 펼침{from{transform:scaleX(.03);opacity:.3}to{transform:none;opacity:1}}
@keyframes 오른{from{transform:translateX(0)}to{transform:translateX(18px)}}
@keyframes 왼{from{transform:translateX(18px)}to{transform:translateX(0)}}
.들어옴{animation:스며 .24s ease-out both}

.운근육{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden;margin-top:8px}
.운근육 span{flex:none;height:28px;padding:0 8px;border:1px solid var(--속선);border-radius:8px;font-size:11px;color:var(--흐림);display:inline-flex;align-items:center;gap:4px}
.운근육 span.주{color:var(--글);border-color:var(--글);font-weight:700}
.운근육 i{width:8px;height:8px;border-radius:50%;flex:none}
.운지표{display:flex;gap:8px;flex-wrap:nowrap;white-space:nowrap;overflow:hidden;align-items:center;margin-top:8px;font-size:11px;color:var(--흐림);font-variant-numeric:tabular-nums}
.운지표 b{font-size:15px;color:var(--글)}
.운칩{height:28px;padding:0 8px;border-radius:8px;border:1px solid var(--속선);font-size:11px;display:inline-flex;align-items:center}
.운칩.오름{color:var(--나쁨);border-color:var(--나쁨)}
.운칩.내림{color:var(--강조);border-color:var(--강조)}
.운칩.빈{color:var(--옅음)}
.운몸{flex:0 0 88px;background:var(--면2);border:1px solid var(--선);border-radius:8px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:4px}
.운몸속{width:80px;height:80px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:8px}
.운몸속 svg{width:100%;height:100%;display:block}
.운몸속 img{width:100%;height:100%;object-fit:cover;display:block}
.운몸 .글{font-size:11px;color:var(--옅음)}
.운세트들{flex:1;min-height:0;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:4px}
.큰몸{display:flex;justify-content:center}
.큰몸 svg{width:100%;height:auto;max-height:280px}
.몸눈금{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--흐림)}
.몸눈금 .바{flex:1;height:8px;border-radius:4px}
.몸표{width:100%;border-collapse:collapse;font-size:13px}
.몸표 td,.몸표 th{padding:8px 0;border-bottom:1px solid var(--선);text-align:left}
.몸표 th{font-size:11px;color:var(--옅음);font-weight:400}
.몸표 .ㄱ{text-align:right;font-variant-numeric:tabular-nums;color:var(--흐림)}
.몸점{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px}
.시트사진{width:88px;height:88px;object-fit:cover;border-radius:8px}

/* ═══ 표시 도구 (10-02) — 폰 화면 위에 빨갛게 긋고 저장하면 Claude 가 읽어 간다 ═══ */

.표시단추[aria-pressed="true"]{background:var(--나쁨);border-color:var(--나쁨);color:#fff;font-weight:700}

.표시줄[hidden]{display:none}
.표시안내{font-size:11px;opacity:.85}
.표시칸{display:flex;gap:4px;align-items:center}
.표시메모{flex:1;min-width:0;height:32px;border-radius:8px;border:1px solid #ffffff55;background:#ffffff14;color:var(--체험글);padding:0 8px;font-size:13px;font-family:inherit}
.표시메모::placeholder{color:var(--체험글);opacity:.6}
.표시줄 .작은{height:32px;padding:0 8px}

.표시알림{font-size:11px;font-weight:700}

function 시트(){ if(!U.시트) return ""; const 종=U.시트.종류; let 안="", 높=false;
  const 머리 = (제목, 닫기="닫기")=> `<div class="머리"><b>${제목}</b><button class="닫기" data-act="시트닫기">${닫기}</button></div>`;
  if(종==="변경"){ const k=U.시트.k, r=루틴(S.예정[k]), 이날=k===오늘()?"오늘":"이 날";
    안 = 머리(`${날글(k)} (${요일(k)})`) +

       <button class="고르기" data-act="집기" data-k="${k}"><b>다른 날로 옮기기</b><span class="곁"></span>›</button>
       ${r&&!r.휴식일?`<button class="고르기" data-act="시트" data-t="휴식" data-k="${k}"><b>${이날}은 휴식</b><span class="곁"></span>›</button>`:""}

    안 = 머리(`${날글(k)} 루틴`) + 칩줄("모드","",["이 날만","이 날부터 순서대로"],모) +
      S.루틴들.map(r=>{ const 실=실제루틴(r); return `<button class="고르기" data-act="루틴꽂기" data-v="${r.id}"><b>${esc(r.이름)}</b><span class="곁">${r.휴식일?"휴식":`예상 ${시간글(예상초(실))}`}${r.자동생성?"":" · 수동"}</span>${S.예정[k]===r.id?"✓":""}</button>`; }).join(""); }
  else if(종==="휴식"){ const k=U.시트.k, 이날=k===오늘()?"오늘":"이 날";
    안 = 머리(`${이날}은 휴식`) +
      `<button class="고르기" data-act="휴식적용" data-v="미루기"><div class="채움"><b>미루기</b><div class="아주작 옅음 맞춤">다음 날부터 ${사흘미리(true,k).map(esc).join(" → ")}</div></div>›</button>
       <button class="고르기" data-act="휴식적용" data-v="건너뛰기"><div class="채움"><b>건너뛰기</b><div class="아주작 옅음 맞춤">다음 날부터 ${사흘미리(false,k).map(esc).join(" → ")}</div></div>›</button>`; }
  else if(종==="종목넣기"){ const r=루틴(U.루틴열림); if(!r){ U.시트=null; return ""; }
    const 플=S.플랜들.map(p=>{ const 넣=U.방금.includes("p:"+p.id), 몇=r.종목.filter(e=>e.플랜id===p.id).length, x=플랜처방(p);
      return `<button class="고르기" data-act="플랜넣기" data-v="${p.id}"><b class="${넣?"강조":""}">${esc(p.이름)}</b><span class="곁">${x?`${x.계.측정일?"측정 · ":""}${x.계.회}회차 ${처방글(x.목)}`:"목표 달성"}</span>${넣?"✓":몇?"있음":"＋"}</button>`; }).join("");
    const 목=S.종목표.filter(x=>x.칸===U.칸고름).map(x=>{ const 넣=U.방금.includes("e:"+x.이름), 있=r.종목.some(e=>e.이름===x.이름&&!e.플랜id);

    안 = 머리(`${esc(r.이름)}에 넣기`,"다 했음") + (플?`<div class="아주작 옅음">운동 플랜</div>${플}`:"") + 칩줄("칸고름","",S.카테고리,U.칸고름) + 목; 높=true; }

      ${e?`<div class="작">${esc(e.이름)} — ${근육글(종목근육(e.이름))}</div>`:""}
      ${사.length?`<div class="줄">${사.slice(0,3).map(u=>`<img class="시트사진" src="${u}" alt="${esc(e.이름)} 사진">`).join("")}</div>`:""}

      <div class="아주작 옅음">단계 = 20 × 오늘 유효 볼륨 ÷ 이전 최대 + 남은 피로 · 주동 1.0 · 보조 0.5 · 협응 0.25</div>
      <button class="버튼" data-act="그림감추기">운동 화면에서 그림 감추기</button>`; 높=true; }

      ${S.메모.map((m,j)=>`<div class="줄 작"><span class="옅음 숫">${m.날.slice(5)}</span><span class="채움">${esc(m.글)}</span><button class="닫기" data-act="메모지움" data-n="${j}" aria-label="지우기">✕</button></div>`).join("")}
      <div class="아주작 옅음" style="margin-top:6px">발자취</div>${S.발자취.slice(-10).reverse().map(x=>`<div class="아주작 흐림">${esc(x)}</div>`).join("")||`<div class="아주작 옅음">아직 없음</div>`}`; }
  return `<div class="가림" data-enter="가림" data-act="시트닫기"><div class="시트 ${높?"높이":""}" data-enter="시트${종}${U.시트.k||""}${U.시트.대상||""}" role="dialog">${안}</div></div>`; }
function 대상폼(){ return U.시트?.대상==="고침" ? U.고침 : U.플랜폼; }
function 방식시트(){ const 대=대상폼(), 열=U.방식펼침??대.방식번호;
  return `<div class="머리"><b>훈련 방식</b><button class="닫기" data-act="방식닫기">닫기</button></div><div class="방식목록">${훈련방식들.map(b=>{ const 골=b.번호===대.방식번호;

function 방식속(b,대){ let 칸;
  if(b.번호===1){ const 세=대.세트수>0?대.세트수:강도들[대.강도].세트, 회=대.직접횟수>0?대.직접횟수:강도들[대.강도].횟수, 직접=대.세트수>0||대.직접횟수>0;
    칸 = `<div class="칩줄">${강도들.map((s,j)=>`<button class="칩 ${대.강도===j&&!직접?"켬":""}" data-act="강도" data-n="${j}">${s.이름}</button>`).join("")}</div>
      <div class="줄 작"><span class="흐림">세트</span><span class="수칸"><button data-act="폼수" data-f="세트수" data-d="-1">−</button><b class="숫">${세}</b><button data-act="폼수" data-f="세트수" data-d="1">＋</button></span>

  const ss=S.세션; if(ss){ if(ss.휴식 && S.시계>=ss.휴식.끝){ ss.휴식=null; if(U.탭==="운동"&&!끌&&!document.activeElement?.dataset?.in){ 그리기(); } 토스트(S.설정.소리진동?"휴식 끝 — 다음 세트":"휴식 끝"); } else 시계그리기(); }
  if(now-저장틱>3000){ 저장틱=now; 저장(); } }, 200);

/* ═════════════ 시작 ═════════════ */
if(!불러오기()) 처음상태(); else { 새칸채움(); 업적알림(업적판정("켤때")); 스탯남기기(); }
U.탭 = S.세션 ? "운동" : "캘린더";
그리기();
</script>

<script>
/* ═══ 표시 도구 — 저장하면 db 의 'marks' 모음에 한 줄 (모음 이름은 영문만 된다), 화면 사진은 assets 에 ═══
   Claude 는 ArtifactData 로 'marks' 를 읽고, 그림 id 로 사진을 받아 본다 */
(()=>{
  const 폰=document.getElementById("폰"), 판=document.getElementById("표시판"), 단추=document.getElementById("표시단추");
  const 줄=document.getElementById("표시줄"), 메모칸=document.getElementById("표시메모"), 알림칸=document.getElementById("표시알림");
  const 저장단추=document.getElementById("표시저장");
  let 켬=false, 선들=[], 지금선=null, 알림시계=null, 남은수=0, 저장중=false;
  const 붓색=()=>getComputedStyle(document.documentElement).getPropertyValue("--나쁨").trim()||"#B3261E";
  const 쓰기=n=> (window.claude && typeof window.claude.use==="function") ? window.claude.use(n).catch(()=>null) : Promise.resolve(null);

  function 알림(글, 오래=false){ 알림칸.textContent=글; 알림칸.hidden=false; clearTimeout(알림시계); 알림시계=setTimeout(()=>{ 알림칸.hidden=true; }, 오래?9000:3500); }
  function 단추글(){ 단추.textContent = "✎ 표시" + (남은수>0?` · ${남은수}`:""); }

  function 맞추기(){ if(!켬) return; const dpr=window.devicePixelRatio||1;
    판.style.left=폰.offsetLeft+"px"; 판.style.top=폰.offsetTop+"px"; 판.style.width=폰.offsetWidth+"px"; 판.style.height=폰.offsetHeight+"px";
    판.width=Math.round(폰.offsetWidth*dpr); 판.height=Math.round(폰.offsetHeight*dpr); 다시그림(); }
  function 긋기(ctx, 줄들, w, h, 굵기){ ctx.strokeStyle=붓색(); ctx.lineWidth=굵기; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.globalAlpha=.9;
    for(const l of 줄들){ if(!l.length) continue; ctx.beginPath(); ctx.moveTo(l[0][0]*w,l[0][1]*h);
      if(l.length===1) ctx.lineTo(l[0][0]*w+0.1,l[0][1]*h); for(let i=1;i<l.length;i++) ctx.lineTo(l[i][0]*w,l[i][1]*h); ctx.stroke(); }
    ctx.globalAlpha=1; }
  function 다시그림(){ const c=판.getContext("2d"); c.clearRect(0,0,판.width,판.height); 긋기(c, 지금선?[...선들,지금선]:선들, 판.width, 판.height, 4*(window.devicePixelRatio||1)); }

  function 켜기(v){ 켬=v; 단추.setAttribute("aria-pressed", v?"true":"false"); 줄.hidden=!v; 판.hidden=!v;
    if(v){ 맞추기(); } else { 지금선=null; } }
  단추.addEventListener("click", ()=>켜기(!켬));
  new ResizeObserver(맞추기).observe(폰); window.addEventListener("resize", 맞추기);

  const 자리=e=>{ const r=판.getBoundingClientRect(); return [Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)), Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]; };
  판.addEventListener("pointerdown", e=>{ e.preventDefault(); 판.setPointerCapture(e.pointerId); 지금선=[자리(e)]; 다시그림(); });
  판.addEventListener("pointermove", e=>{ if(!지금선) return; const p=자리(e), q=지금선[지금선.length-1], r=판.getBoundingClientRect();
    if(Math.hypot((p[0]-q[0])*r.width,(p[1]-q[1])*r.height)<2) return; 지금선.push(p); 다시그림(); });
  const 끝=()=>{ if(!지금선) return; 선들.push(지금선.map(([x,y])=>[+x.toFixed(4),+y.toFixed(4)])); 지금선=null; 다시그림(); };
  판.addEventListener("pointerup", 끝); 판.addEventListener("pointercancel", 끝);
  document.getElementById("표시되돌").addEventListener("click", ()=>{ 선들.pop(); 다시그림(); });
  document.getElementById("표시지움").addEventListener("click", ()=>{ 선들=[]; 다시그림(); });

  /* 화면 사진 — html2canvas 를 처음 저장할 때만 불러온다 */
  let 도구=null;
  function 사진도구(){ if(window.html2canvas) return Promise.resolve(window.html2canvas); if(도구) return 도구;
    도구=new Promise((ok,no)=>{ const t=document.createElement("script"); t.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
      t.onload=()=>ok(window.html2canvas); t.onerror=()=>{ 도구=null; no(new Error("사진 도구를 못 불러옴")); }; document.head.appendChild(t); }); return 도구; }
  async function 화면사진(){ const h2c=await 사진도구(); const 배=getComputedStyle(폰).backgroundColor;
    const c=await h2c(폰,{backgroundColor:배, scale:1.5, logging:false, useCORS:true});
    const x=c.getContext("2d"); x.setTransform(1,0,0,1,0,0);   // html2canvas 가 남긴 이동 · 확대를 지우고 긋는다 (안 지우면 선이 폰 위치만큼 밀린다)
    긋기(x, 선들, c.width, c.height, 6);
    return await new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error("사진 만들기 실패")),"image/jpeg",0.85)); }
  /* 그때 앱 상태 — 사진(data:)은 빼고. Claude 가 같은 화면을 다시 띄워 볼 때 쓴다 */
  function 상태글(){ return JSON.stringify({S, U:{탭:U.탭, 시트:U.시트||null, 루틴열림:U.루틴열림??null, 고른날:U.고른날??null, 본:U.본??null}},
    (k,v)=> typeof v==="string" && v.startsWith("data:") ? "(사진 생략)" : v); }

  저장단추.addEventListener("click", async ()=>{
    if(저장중) return; const 메모=메모칸.value.trim();
    if(!선들.length && !메모){ 알림("먼저 빨갛게 그어 주세요"); return; }
    저장중=true; 저장단추.textContent="저장 중…";
    try{
      const db=await 쓰기("db");
      if(!db){ 알림("이 화면에서는 저장할 수 없습니다 — claude.ai 에 로그인한 채 열어 주세요", true); return; }
      const assets=await 쓰기("assets"); let 그림=null, 상태=null, 그림오류=null;
      if(assets){
        try{ 그림=(await assets.upload(await 화면사진(), {type:"image/jpeg"})).id; }catch(e){ 그림오류=String(e?.code||e?.message||e); }
        try{ 상태=(await assets.upload(new Blob([상태글()],{type:"application/json"}), {type:"application/json"})).id; }catch(e){}
      } else 그림오류="사진 저장 권한 없음";
      await db.collection("marks").add({ 시각:new Date().toISOString(), 일차:S.일차, 날:오늘(), 화면:화면키(), 탭:U.탭,
        시트:U.시트?.종류||null, 본:U.본??null, 메모, 선:선들, 폭:폰.offsetWidth, 높이:폰.offsetHeight, 그림, 상태, 그림오류, 확인:false });
      선들=[]; 메모칸.value=""; 켜기(false);
      알림(그림?"저장했습니다 — Claude 에게 '표시해 놨어' 라고 말해 주세요":"선과 메모는 저장했습니다 (화면 사진은 못 찍음) — Claude 에게 말해 주세요", true);
    }catch(e){ 알림("저장하지 못했습니다 — "+(e?.code==="quota_exceeded"?"저장 칸이 찼습니다":"잠시 뒤 다시 눌러 주세요"), true); }
    finally{ 저장중=false; 저장단추.textContent="저장"; }
  });

  /* 아직 Claude 가 확인하지 않은 표시 수를 단추에 */
  쓰기("db").then(db=>{ if(!db) return;
    db.collection("marks").where("확인","==",false).onSnapshot(q=>{ 남은수=q.size; 단추글(); }, ()=>{}); });
})();
</script>
