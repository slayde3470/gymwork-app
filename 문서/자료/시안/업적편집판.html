<title>업적 편집판</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--바탕:#F8FAFB;--면:#FFFFFF;--면2:#F0F4F8;--선:#D3DFE9;--속선:#B5C9DA;--글:#0B1620;--흐림:#35495B;--옅음:#5E6B77;--강조:#084B83;--강조글:#FFFFFF;--강조옅음:#E1E9F0;--좋음:#3F7F1A;--나쁨:#B42318;
--초보:#94612A;--중급:#5A6E82;--고급:#8F6A00;--미친자:#7B2CBF;--유머:#0F7B6C;--숨은:#3E3A78;
--본문:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--고정폭:"IBM Plex Mono",ui-monospace,Menlo,monospace;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--바탕:#07121E;--면:#111F2E;--면2:#172738;--선:#253A50;--속선:#37526E;--글:#E5F0FA;--흐림:#C5D1DB;--옅음:#9BA7B3;--강조:#7FB3E6;--강조글:#04213D;--강조옅음:#1F3246;--좋음:#9BE06B;--나쁨:#FF8A80;--초보:#D9A066;--중급:#A9BACB;--고급:#E2BE55;--미친자:#C79BF2;--유머:#5CC9B7;--숨은:#AFA9F0;color-scheme:dark}}
:root[data-theme="dark"]{--바탕:#07121E;--면:#111F2E;--면2:#172738;--선:#253A50;--속선:#37526E;--글:#E5F0FA;--흐림:#C5D1DB;--옅음:#9BA7B3;--강조:#7FB3E6;--강조글:#04213D;--강조옅음:#1F3246;--좋음:#9BE06B;--나쁨:#FF8A80;--초보:#D9A066;--중급:#A9BACB;--고급:#E2BE55;--미친자:#C79BF2;--유머:#5CC9B7;--숨은:#AFA9F0;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--바탕);color:var(--글);font-family:var(--본문);font-size:15px;line-height:1.45;letter-spacing:-.01em;padding:16px 12px 80px}
.틀{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:22px;letter-spacing:-.02em}
.윗{font-size:11px;color:var(--옅음);font-weight:700;letter-spacing:.04em}
.안내{margin:0;font-size:13px;color:var(--흐림);max-width:72ch}
.상자{font-size:13px;color:var(--흐림);background:var(--면);border:1px solid var(--선);border-radius:16px;padding:12px 14px}
.상자 p{margin:0 0 4px}.상자 p:last-child{margin:0}
.조작{position:sticky;top:0;z-index:5;background:var(--바탕);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--선)}

.상태{font-size:13px;color:var(--흐림);margin-left:auto;white-space:nowrap}.상태.저장중{color:var(--고급)}.상태.오류{color:var(--나쁨)}.상태.됨{color:var(--좋음)}

nav a{font-size:11px;color:var(--흐림);text-decoration:none;border:1px solid var(--선);border-radius:8px;padding:4px 8px;background:var(--면)}nav a b{color:var(--글)}
.묶음{display:flex;flex-direction:column;gap:8px;scroll-margin-top:72px}

.카드{background:var(--면);border:1px solid var(--선);border-left:2px solid var(--등급색,var(--속선));border-radius:16px;padding:14px;margin:0;display:flex;flex-direction:column;gap:4px}
.카드.숨은{border-left-color:var(--숨은)}

.번{font-family:var(--고정폭);font-weight:500;color:var(--글)}
.칭번{font-family:var(--고정폭);color:var(--옅음)}
.메타 select{font:inherit;font-size:11px;font-weight:700;height:28px;padding:0 4px;border:1px solid var(--속선);border-radius:8px;background:var(--면);color:var(--등급색,var(--흐림))}
.숨김칸{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 8px;border:1px solid var(--속선);border-radius:8px;color:var(--흐림);cursor:pointer;font-weight:700}
.숨김칸 input{accent-color:var(--숨은);width:16px;height:16px;margin:0}
.카드.숨은 .숨김칸{color:var(--숨은);border-color:var(--숨은)}
.이름표{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--옅음);margin-top:8px}

.칭호칸{font-size:15px;font-weight:700;letter-spacing:-.02em}
.이름칸{font-size:13px;color:var(--흐림)}
.조건칸{font-size:13px;color:var(--흐림)}
.설명칸{font-size:13px;color:var(--흐림)}
.플칸{font-size:11px;font-style:italic;color:var(--옅음)}
.대기칸{font-size:13px;color:var(--흐림);background:var(--면2)}
.플줄{display:flex;flex-direction:column;gap:4px}
.플줄 select{font:inherit;font-size:11px;height:28px;border:1px solid var(--속선);border-radius:8px;background:var(--면);color:var(--흐림);max-width:100%}
.없음{font-size:11px;color:var(--숨은);font-weight:700;margin-top:8px}
.바뀐{border-color:var(--좋음)!important}
.등급-초보{--등급색:var(--초보)}.등급-중급{--등급색:var(--중급)}.등급-고급{--등급색:var(--고급)}
.등급-미친자{--등급색:var(--미친자)}.등급-유머{--등급색:var(--유머)}

.이야기 p{margin:0}.이플{font-size:13px;font-style:italic}.이곳{font-size:11px;color:var(--옅음);margin-top:4px}.이곳.남음{color:var(--고급);font-weight:700}
.더함{display:flex;gap:8px;flex-wrap:wrap}
.단추{font:inherit;font-size:13px;height:32px;padding:0 12px;border:1px solid var(--강조);border-radius:8px;background:var(--면);color:var(--강조);cursor:pointer;font-weight:700}

.새표{font-size:11px;font-weight:700;color:var(--좋음)}

.아래띠 button{font:inherit;font-size:13px;font-weight:700;height:32px;padding:0 12px;border:0;border-radius:8px;background:var(--바탕);color:var(--글);cursor:pointer}
.빈화면{padding:24px;text-align:center;color:var(--옅음);font-size:13px}
[hidden]{display:none!important}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--강조);outline-offset:2px}
@media (max-width:640px){h1{font-size:18px}.판{grid-template-columns:1fr}}
</style>
<div class="틀">
<header style="display:flex;flex-direction:column;gap:8px">
<div class="윗">하젠하이데 · 업적 편집판</div>
<h1>업적 107개 — 고치면 바로 저장됩니다</h1>
<p class="안내">글자를 누르면 고칠 수 있습니다. 칸을 벗어나면 저장됩니다. <b>숨은</b> 칸을 켜면 그 업적의 플레이버가 빠져 '남은 조각'으로 돌아가고, 끄면 남은 조각 하나가 붙습니다. 분류마다 맨 위에 메모 칸이 있습니다. 분류마다 <b>+ 업적</b> 단추로 새 업적을, 맨 아래에서 <b>새 분류</b>를, '조각' 보기에서 <b>새 조각</b>을 더할 수 있습니다. 번호는 만들 때 정해지고 숨은 여부를 바꿔도 그대로입니다 — 앱에 옮길 때 다시 맞춥니다.</p>
</header>
<div class="상자" id="요약"><p>불러오는 중…</p></div>
<div class="조작">
<div class="고름" role="group" aria-label="보기"><button type="button" data-보기="업적" aria-pressed="true">업적</button><button type="button" data-보기="이야기" aria-pressed="false">조각</button></div>
<div class="고름" role="group" aria-label="거르기"><button type="button" data-거름="전체" aria-pressed="true">전체</button><button type="button" data-거름="일반" aria-pressed="false">일반</button><button type="button" data-거름="숨은" aria-pressed="false">숨은</button></div>
<input id="찾기" type="search" placeholder="번호 · 칭호 · 낱말로 찾기" autocomplete="off">
<span class="상태" id="상태">연결 중</span>
</div>
<div id="업적보기"><nav id="분류줄"></nav><div id="묶음들" style="display:flex;flex-direction:column;gap:24px;margin-top:16px"></div></div>
<div id="이야기보기" hidden><div class="더하기줄" style="margin-bottom:16px"><textarea class="칸 플칸" id="새조각글" rows="2" placeholder="새 플레이버 조각 (1~2문장 · ~다 · 이름 없이)" aria-label="새 조각"></textarea><button type="button" class="단추" id="조각더함">조각 더하기</button></div><ol class="이야기" id="조각줄"></ol></div>
<div class="아래띠" id="아래띠" hidden role="status"><span id="아래띠글"></span><button type="button" id="되돌림">되돌리기</button></div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const 등급목록=["초보","중급","고급","미친자","유머","(히든 · 등급 없음)"];
const 상태={업적:new Map(),조각:new Map(),메모:new Map(),받음:{업적:false,조각:false,메모:false},그림:false,보기:"업적",거름:"전체",쓰기:true,서명:""};
let db=null, 대기중=0;
const num=n=>{const [a,b]=String(n).split("-").map(Number);return a*1000+b;};
const 짧은=c=>String(c||"").split(" (")[0];
function 상태표시(t,cls){const el=$("#상태");el.textContent=t;el.className="상태 "+(cls||"");}
function el(tag,attrs,...kids){const e=document.createElement(tag);for(const [k,v] of Object.entries(attrs||{})){if(k==="class")e.className=v;else if(k.startsWith("data-"))e.setAttribute(k,v);else if(k in e)e[k]=v;else e.setAttribute(k,v);}for(const k of kids){if(k==null)continue;e.append(k.nodeType?k:document.createTextNode(k));}return e;}
function 쓰는조각(){const s=new Set();for(const a of 상태.업적.values()){if(!a.숨김&&a.사실번호)s.add(a.사실번호);}return s;}
function 남은조각(){const 씀=쓰는조각();return [...상태.조각.entries()].filter(([id])=>!씀.has(id)).sort((a,b)=>a[0]<b[0]?-1:1);}
async function 쓰기(path,body,merge){
  if(!db||!상태.쓰기)return;
  대기중++;상태표시("저장 중…","저장중");
  try{ merge? await db.doc(path).update(body) : await db.doc(path).set(body); 대기중--; if(!대기중)상태표시("저장됨","됨"); return true; }
  catch(e){ 대기중--; if(e&&e.code==="invalid_argument"){상태.쓰기=false;상태표시("읽기만 가능합니다","오류");$$(".칸,select,input[type=checkbox],.단추,.지움").forEach(x=>x.disabled=true);} else 상태표시("저장 못 함 ("+(e&&e.code||"오류")+") — 다시 해 주세요","오류"); return false; }
}
function 다음번호(숨){const p=숨?2:1;let m=0;for(const k of 상태.업적.keys()){const [a,b]=k.split("-").map(Number);if(a===p&&b>m)m=b;}return {번호:p+"-"+(m+1),칭호번호:(숨?4:3)+"-"+(m+1)};}
function 다음조각(){let m=0;for(const k of 상태.조각.keys()){if(k[0]!=="N")continue;const n=Number(k.slice(1));if(n>m)m=n;}return "N"+String(m+1).padStart(3,"0");}
function 다음분류(){let m=0;for(const k of 상태.메모.keys()){const n=Number(k.slice(1));if(n>m)m=n;}return "c"+String(m+1).padStart(2,"0");}
function 분류순서(){const out=[];for(const [id,m] of [...상태.메모.entries()].sort((a,b)=>a[0]<b[0]?-1:1))out.push({id,분류:m.분류});
  const 있음=new Set(out.map(x=>x.분류));const 남=[...상태.업적.values()].sort((a,b)=>num(a.번호)-num(b.번호));for(const a of 남)if(!있음.has(a.분류)){있음.add(a.분류);out.push({id:null,분류:a.분류});}return out;}
let 띠시계=null,되돌릴=null;
function 띠(글,되){$("#아래띠글").textContent=글;$("#되돌림").hidden=!되;되돌릴=되||null;$("#아래띠").hidden=false;clearTimeout(띠시계);띠시계=setTimeout(()=>{$("#아래띠").hidden=true;되돌릴=null;},6000);}
async function 업적더함(분류,숨){const {번호,칭호번호}=다음번호(숨);const 몸={번호,칭호번호,이름:"",칭호:"새 업적",등급:숨?"(히든 · 등급 없음)":"초보",숨김:!!숨,분류,조건:"",설명:"",플레이버:"",사실번호:"",대기:"",새로:true,고친때:new Date().toISOString()};
  if(!숨){const 남=남은조각();if(남.length){const [fid,f]=남[Math.floor(Math.random()*남.length)];몸.플레이버=f.text;몸.사실번호=fid;}}
  if(await 쓰기("achievements/"+번호,몸,false)){띠(번호+" 을 만들었습니다");setTimeout(()=>{const c=document.querySelector(`.카드[data-id="${번호}"] .칭호칸`);if(c){c.scrollIntoView({block:"center"});c.focus();c.select();}},300);}}
async function 업적지움(id){const a=상태.업적.get(id);if(!a)return;const 옛={...a};if(await 쓰기삭제("achievements/"+id))띠(id+" 을 지웠습니다",async()=>{await 쓰기("achievements/"+id,옛,false);띠(id+" 을 되돌렸습니다");});}
async function 쓰기삭제(path){if(!db||!상태.쓰기)return false;대기중++;상태표시("저장 중…","저장중");try{await db.doc(path).delete();대기중--;if(!대기중)상태표시("저장됨","됨");return true;}catch(e){대기중--;상태표시("지우지 못함 ("+(e&&e.code||"오류")+")","오류");return false;}}
function 표시(e){e.classList.add("바뀐");setTimeout(()=>e.classList.remove("바뀐"),900);}
function 글칸(id,field,cls,multi,label){
  const e=multi?el("textarea",{class:"칸 "+cls,rows:2,"data-id":id,"data-field":field,"aria-label":label}):el("input",{class:"칸 "+cls,type:"text","data-id":id,"data-field":field,"aria-label":label});
  e.addEventListener("change",async()=>{const v=e.value.trim();const a=상태.업적.get(id);if(!a||(a[field]||"")===v)return;if(await 쓰기("achievements/"+id,{[field]:v,고친때:new Date().toISOString()},true))표시(e);});
  return e;
}
function 카드(a){
  const id=a.번호;
  const 등급=el("select",{"data-id":id,"data-field":"등급","aria-label":"등급"},...등급목록.map(g=>el("option",{value:g},g==="(히든 · 등급 없음)"?"등급 없음":g)));
  등급.addEventListener("change",async()=>{await 쓰기("achievements/"+id,{등급:등급.value,고친때:new Date().toISOString()},true);});
  const 숨=el("input",{type:"checkbox","data-id":id,"data-field":"숨김"});
