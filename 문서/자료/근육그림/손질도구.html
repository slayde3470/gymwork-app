<title>근육 지도 손질</title>
<style>
/* 한 화면 도구: 위 = 그림 고르기 · 가운데 = 그림판(두 손가락 확대) · 아래 = 도구 줄. 그림이 어두운 화면용이라 어두운 한 가지 모습으로 고정 */
:root {
  color-scheme: dark;
  --bg: #16181b;
  --panel: #202327;
  --panel-2: #2a2e33;
  --line: #3a3f46;
  --fg: #e9ecef;
  --muted: #9aa3ad;
  --accent: #7fd1b9;
  --accent-ink: #0f2a23;
  --warn: #f0b35a;
  --danger: #ef7d73;
  --font: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden; }
.app { height: 100%; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
button:disabled { opacity: .45; cursor: default; }

.top { display: flex; gap: 6px; padding: 8px 12px; overflow-x: auto; background: var(--panel); border-bottom: 1px solid var(--line); flex: none; scrollbar-width: none; }
.top button { white-space: nowrap; flex: none; font-size: 13px; }
.top .saved-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); margin-left: 5px; vertical-align: middle; }

.status { display: flex; justify-content: space-between; gap: 8px; padding: 5px 12px; font-size: 12px; color: var(--muted); background: var(--bg); flex: none; min-height: 26px; align-items: center; }
.status b { color: var(--fg); font-weight: 600; }
.status .right { white-space: nowrap; }

.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; background: #111315; }
.board { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.board canvas { position: absolute; left: 0; top: 0; image-rendering: pixelated; }
.tags { position: absolute; left: 0; top: 0; pointer-events: none; }
.tag { position: absolute; transform: translate(-50%, -50%); background: rgba(255,255,255,.86); color: #111; border-radius: 3px; padding: 0 .3em; white-space: nowrap; font-weight: 700; font-size: calc(11px * var(--inv, 1)); line-height: 1.35; }
.cursor { position: absolute; border: 1.5px solid #fff; border-radius: 50%; pointer-events: none; box-shadow: 0 0 0 1px #000; display: none; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; }

.tools { flex: none; background: var(--panel); border-top: 1px solid var(--line); padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.row .grow { flex: 1; min-width: 0; }
.tgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.tgrid button, .row button { padding: 7px 6px; font-size: 13px; }
.ic { min-width: 40px; font-size: 16px !important; line-height: 1; }
.muscle-btn { display: flex; align-items: center; gap: 8px; text-align: left; width: 100%; }
.sw { width: 18px; height: 18px; border-radius: 4px; flex: none; border: 1px solid rgba(255,255,255,.35); }
.muscle-btn .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.muscle-btn .id { color: var(--muted); font-family: var(--mono); font-size: 11px; margin-left: auto; white-space: nowrap; }
label.sl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
label.sl input { width: 84px; accent-color: var(--accent); }
.save { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.toggle { font-size: 12px; }

.toast { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #000c; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 13px; pointer-events: none; opacity: 0; transition: opacity .2s; max-width: calc(100% - 32px); text-align: center; }
.toast.on { opacity: 1; }

.sheet { position: fixed; inset: 0; background: #0009; display: flex; align-items: flex-end; z-index: 10; }
.sheet[hidden] { display: none !important; }
.sheet .box { background: var(--panel); width: 100%; max-height: 78%; border-radius: 14px 14px 0 0; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet .head { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); }
.sheet input[type=search] { flex: 1; min-width: 0; font: inherit; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.sheet .list { overflow-y: auto; padding: 4px 12px 16px; }
.sheet h3 { font-size: 12px; color: var(--muted); font-weight: 600; margin: 14px 0 6px; letter-spacing: .02em; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.item { display: flex; align-items: center; gap: 7px; text-align: left; padding: 7px 8px; min-width: 0; }
.item .t { min-width: 0; }
.item .t div:first-child { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .t div:last-child { font-size: 10.5px; color: var(--muted); font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item.on { border-color: var(--accent); }

.memo { display: grid; gap: 8px; padding: 12px; }
.memo textarea { font: inherit; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; min-height: 64px; resize: vertical; }
.memo p { margin: 0; font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div class="app">

    </div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";
const PICS = [
  { id: "front", file: "01_전신앞", name: "전신 앞", lr: true },
  { id: "back", file: "02_전신뒤", name: "전신 뒤", lr: true },
  { id: "chest", file: "03_가슴확대", name: "가슴 확대" },
  { id: "arm", file: "04_팔어깨확대", name: "팔~어깨" },
  { id: "leg", file: "05_굽힌다리확대", name: "굽힌 다리" },
  { id: "upback", file: "06_등확대", name: "등 확대" },
];
const SIDE = { "": "", L: " 왼", R: " 오" };
const REGION_ORDER = ["chest", "back", "shoulders", "arms", "core", "legs", "neck"];
const $ = (id) => document.getElementById(id);

// ───── 상태 ─────
let pal = [null];            // 번호 → {hex, rgb, 근육, 쪽, 이름, region}
const keyIdx = new Map();     // "근육|쪽" → 번호
const rgbIdx = new Map();     // r<<16|g<<8|b → 번호
let regionName = {};
let cur = null;               // 지금 그림 {pic, W, H, lab, body, imgEl, auto, saved}
let curIdx = 0;               // 칠할 번호
let tool = "paint";
let mirror = true, showTags = false, showEdge = true, opa = 0.55, brush = 12;
let view = { s: 1, tx: 0, ty: 0 };
let db = null;
const cache = {};             // pic.id → 그림 상태(그림을 바꿔도 손질은 남는다)

function toast(msg, ms = 1800) {
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), ms);
}
function label(i) { const p = pal[i]; return p ? p.이름.split(" (")[0] + SIDE[p.쪽] : "근육 아님"; }

// ───── 근육 목록 ─────
async function loadTables() {
  const [colors, cat] = await Promise.all([
    fetch("data/colors.json").then((r) => r.json()),
    fetch("data/catalog.json").then((r) => r.json()),
  ]);
  const byId = Object.fromEntries(cat.muscles.map((m) => [m.id, m]));
  const regionOf = (id) => { let m = byId[id]; while (m && byId[m.parent]) m = byId[m.parent]; return m ? m.parent : ""; };
  regionName = Object.fromEntries(cat.regions.map((r) => [r.id, r.name]));
  for (const [hex, v] of Object.entries(colors.색)) {
    const rgb = [1, 3, 5].map((k) => parseInt(hex.slice(k, k + 2), 16));
    const i = pal.length;
    pal.push({ hex, rgb, 근육: v.근육, 쪽: v.쪽, 이름: v.이름, region: regionOf(v.근육) });
    keyIdx.set(v.근육 + "|" + v.쪽, i);
    rgbIdx.set((rgb[0] << 16) | (rgb[1] << 8) | rgb[2], i);
  }
}
function mirrorIdx(i) {
  const p = pal[i]; if (!p || !p.쪽) return i;
  return keyIdx.get(p.근육 + "|" + (p.쪽 === "L" ? "R" : "L")) || i;
}

// ───── 그림 불러오기 ─────
function loadImg(src) {
  return new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = bad; im.src = src; });
}
function pixels(im) {
  const c = document.createElement("canvas"); c.width = im.naturalWidth; c.height = im.naturalHeight;
  const x = c.getContext("2d", { willReadFrequently: true }); x.drawImage(im, 0, 0);
  return x.getImageData(0, 0, c.width, c.height).data;
}
function decodeMap(px, n) {
  const lab = new Uint16Array(n); let bad = 0;
  for (let i = 0, j = 0; i < n; i++, j += 4) {
    if (px[j + 3] < 128) continue;
    const k = rgbIdx.get((px[j] << 16) | (px[j + 1] << 8) | px[j + 2]);
    if (k) lab[i] = k; else bad++;
  }
  return { lab, bad };
}

async function openPic(pic) {
  document.querySelectorAll("#pics button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.id === pic.id)));
  $("loading").hidden = false;
  try {
    let st = cache[pic.id];
    if (!st) {
      const [im, mp] = await Promise.all([loadImg("img/" + pic.id + ".png"), loadImg("map/" + pic.id + ".png")]);
      const W = im.naturalWidth, H = im.naturalHeight, n = W * H;
      const ipx = pixels(im);
      const body = new Uint8Array(n);
      for (let i = 0; i < n; i++) body[i] = ipx[i * 4 + 3] >= 128 ? 1 : 0;
      const auto = decodeMap(pixels(mp), n);
      st = { pic, W, H, body, imgEl: im, auto: auto.lab, lab: auto.lab.slice(), from: "처음 지도", undo: [], redo: [], dirty: false };
      cache[pic.id] = st;
      await loadSaved(st);
    }
    cur = st;
    const ci = $("cImg"), co = $("cOv");
    for (const c of [ci, co]) { c.width = st.W; c.height = st.H; c.style.width = st.W + "px"; c.style.height = st.H + "px"; }
    ci.getContext("2d").drawImage(st.imgEl, 0, 0);
    st.ovCtx = co.getContext("2d");
    st.ovData = st.ovCtx.createImageData(st.W, st.H);
    $("mirror").hidden = !pic.lr;
    // 칠할 근육이 이 그림 종류(좌우 / 확대)에 맞지 않으면 바꾼다
    if (curIdx && (!!pal[curIdx].쪽) !== !!pic.lr) curIdx = 0;
    if (!curIdx) curIdx = mostUsed(st) || 0;
    showCur();
    fit(); renderAll(); updateTags(); updateUndo(); updateSrc();
  } catch (e) {
    toast("그림을 불러오지 못했습니다: " + (e && e.message || e), 4000);
  }
  $("loading").hidden = true;
}
function mostUsed(st) {
  const cnt = new Map();
  for (let i = 0; i < st.lab.length; i += 7) if (st.lab[i]) cnt.set(st.lab[i], (cnt.get(st.lab[i]) || 0) + 1);
  let best = 0, bc = 0; for (const [k, c] of cnt) if (c > bc) { best = k; bc = c; }
  return best;
}
function updateSrc() {
  if (!cur) return;
  $("src").textContent = cur.from + (cur.dirty ? " · 저장 안 함" : "");
  document.querySelectorAll("#pics button").forEach((b) => {
    const st = cache[b.dataset.id];
    b.querySelector(".saved-dot").hidden = !(st && st.dirty);
  });
}

// ───── 보기(확대 · 이동) ─────
function fit() {
  const r = $("stage").getBoundingClientRect();
  const s = Math.min(r.width / cur.W, r.height / cur.H) * 0.96;
  view = { s, tx: (r.width - cur.W * s) / 2, ty: (r.height - cur.H * s) / 2 };
  applyView();
}
function applyView() {
  $("board").style.transform = `translate(${view.tx}px,${view.ty}px) scale(${view.s})`;
  $("board").style.setProperty("--inv", (1 / view.s).toFixed(4));
}
function toImg(cx, cy) {
  const r = $("stage").getBoundingClientRect();
  return [(cx - r.left - view.tx) / view.s, (cy - r.top - view.ty) / view.s];
}
function zoomAt(cx, cy, k) {
  const r = $("stage").getBoundingClientRect();
  const px = cx - r.left, py = cy - r.top;
  const ns = Math.min(Math.max(view.s * k, 0.15), 12);
  view.tx = px - (px - view.tx) * (ns / view.s);
  view.ty = py - (py - view.ty) * (ns / view.s);
  view.s = ns; applyView();
}

// ───── 그리기 ─────
function renderRect(x0, y0, x1, y1) {
  const { W, H, lab, body, ovData } = cur; const d = ovData.data;
  x0 = Math.max(0, x0 | 0); y0 = Math.max(0, y0 | 0); x1 = Math.min(W - 1, x1 | 0); y1 = Math.min(H - 1, y1 | 0);
  if (x1 < x0 || y1 < y0) return;
  const a = Math.round(opa * 255);
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const i = y * W + x, j = i * 4, v = lab[i];
      if (!body[i]) { d[j + 3] = 0; continue; }
      let edge = false;
      if (showEdge) {
        edge = (x > 0 && lab[i - 1] !== v) || (x < W - 1 && lab[i + 1] !== v) || (y > 0 && lab[i - W] !== v) || (y < H - 1 && lab[i + W] !== v);
      }
      if (edge && (v || showEdge)) { d[j] = 10; d[j + 1] = 10; d[j + 2] = 12; d[j + 3] = 230; continue; }
      if (!v) { d[j + 3] = 0; continue; }
      const c = pal[v].rgb; d[j] = c[0]; d[j + 1] = c[1]; d[j + 2] = c[2]; d[j + 3] = a;
    }
  }
  cur.ovCtx.putImageData(ovData, 0, 0, x0, y0, x1 - x0 + 1, y1 - y0 + 1);
}
function renderAll() { renderRect(0, 0, cur.W - 1, cur.H - 1); }

let stroke = null;  // {changes: Map(i → old), box}
function axis() { return cur.pic.lr ? 383 : cur.W / 2; }
function grow(x0, y0, x1, y1) {
  const b = stroke.box;
  if (!b) { stroke.box = [x0, y0, x1, y1]; return; }
  b[0] = Math.min(b[0], x0); b[1] = Math.min(b[1], y0); b[2] = Math.max(b[2], x1); b[3] = Math.max(b[3], y1);
}
function beginStroke() { stroke = { changes: new Map(), box: null }; }
function endStroke(keep = true) {
  if (!stroke) return;
  if (!keep) {
    for (const [i, old] of stroke.changes) cur.lab[i] = old;
    if (stroke.box) renderRect(stroke.box[0] - 1, stroke.box[1] - 1, stroke.box[2] + 1, stroke.box[3] + 1);
  } else if (stroke.changes.size) {
    const idx = new Uint32Array(stroke.changes.size), old = new Uint16Array(stroke.changes.size), nw = new Uint16Array(stroke.changes.size);
    let k = 0; for (const [i, o] of stroke.changes) { idx[k] = i; old[k] = o; nw[k] = cur.lab[i]; k++; }
    cur.undo.push({ idx, old, nw, box: stroke.box }); if (cur.undo.length > 40) cur.undo.shift();
    cur.redo = []; cur.dirty = true; updateUndo(); updateTags(); updateSrc();
  }
  stroke = null;
}
function applyStep(step, useNew) {
  const src = useNew ? step.nw : step.old;
  for (let k = 0; k < step.idx.length; k++) cur.lab[step.idx[k]] = src[k];
  const b = step.box; renderRect(b[0] - 1, b[1] - 1, b[2] + 1, b[3] + 1);
  cur.dirty = true; updateTags(); updateUndo(); updateSrc();
}
function mergeLast() {               // 마지막 두 걸음을 한 걸음으로(좌우 채우기를 한 번에 되돌리게)
  const b = cur.undo.pop(), a = cur.undo.pop(); const cat = (x, y, T) => { const o = new T(x.length + y.length); o.set(x); o.set(y, x.length); return o; };
  cur.undo.push({ idx: cat(a.idx, b.idx, Uint32Array), old: cat(a.old, b.old, Uint16Array), nw: cat(a.nw, b.nw, Uint16Array),
    box: [Math.min(a.box[0], b.box[0]), Math.min(a.box[1], b.box[1]), Math.max(a.box[2], b.box[2]), Math.max(a.box[3], b.box[3])] });
}
function updateUndo() { $("undo").disabled = !cur || !cur.undo.length; $("redo").disabled = !cur || !cur.redo.length; }

function fillAt(x, y, val) {
  const { W, H, lab, body } = cur; const i0 = y * W + x;
  if (!body[i0] || lab[i0] === val) return 0;
  const from = lab[i0];
  beginStroke();
  const q = [i0]; stroke.changes.set(i0, from); lab[i0] = val;
  let x0 = x, x1 = x, y0 = y, y1 = y;
  while (q.length) {
    const i = q.pop(), cx = i % W, cy = (i / W) | 0;
    if (cx < x0) x0 = cx; if (cx > x1) x1 = cx; if (cy < y0) y0 = cy; if (cy > y1) y1 = cy;
    const nb = [cx > 0 ? i - 1 : -1, cx < W - 1 ? i + 1 : -1, cy > 0 ? i - W : -1, cy < H - 1 ? i + W : -1];
    for (const j of nb) if (j >= 0 && body[j] && lab[j] === from) { stroke.changes.set(j, from); lab[j] = val; q.push(j); }
  }
  stroke.box = [x0, y0, x1, y1]; renderRect(x0 - 1, y0 - 1, x1 + 1, y1 + 1);
  const n = stroke.changes.size; endStroke(true); return n;
}

// ───── 이름표 ─────
function updateTags() {
  const box = $("tags"); box.innerHTML = "";
  if (!showTags || !cur) return;
  const { W, lab } = cur; const sx = new Map(), sy = new Map(), sn = new Map();
  for (let i = 0; i < lab.length; i += 3) {
    const v = lab[i]; if (!v) continue;
    sx.set(v, (sx.get(v) || 0) + (i % W)); sy.set(v, (sy.get(v) || 0) + ((i / W) | 0)); sn.set(v, (sn.get(v) || 0) + 1);
  }
  for (const [v, n] of sn) {
    if (n < 15) continue;
    let x = sx.get(v) / n, y = sy.get(v) / n;
    // 무게중심이 칸 밖이면 가장 가까운 칸 픽셀로
    if (lab[(y | 0) * W + (x | 0)] !== v) {
      let best = 1e18, bi = -1;
      for (let i = 0; i < lab.length; i += 5) if (lab[i] === v) { const dx = i % W - x, dy = ((i / W) | 0) - y, d = dx * dx + dy * dy; if (d < best) { best = d; bi = i; } }
      if (bi >= 0) { x = bi % W; y = (bi / W) | 0; }
    }
    const t = document.createElement("div"); t.className = "tag"; t.textContent = label(v);
    t.style.left = x + "px"; t.style.top = y + "px"; box.appendChild(t);
  }
}

// ───── 손가락 · 마우스 ─────
const stage = $("stage"); const pts = new Map(); let pinch = null, panning = null, tapStart = null;
function underAt(cx, cy) {
  const [x, y] = toImg(cx, cy).map(Math.floor);
  if (!cur || x < 0 || y < 0 || x >= cur.W || y >= cur.H) return null;
  const i = y * cur.W + x; return { x, y, v: cur.body[i] ? cur.lab[i] : -1 };
}
function showUnder(u) {
  $("under").innerHTML = "손가락 아래: " + (u ? (u.v < 0 ? "몸 밖" : "<b></b>") : "—");
  if (u && u.v >= 0) $("under").querySelector("b").textContent = label(u.v);
}
function moveCursor(cx, cy) {
  const c = $("cursor"); const r = stage.getBoundingClientRect();
  if (tool !== "paint" && tool !== "erase") { c.style.display = "none"; return; }
  const d = brush * 2 * view.s; c.style.display = "block";
  c.style.width = c.style.height = d + "px";
  c.style.left = (cx - r.left - d / 2) + "px"; c.style.top = (cy - r.top - d / 2) + "px";
}
let last = null;
function paintTo(cx, cy) {
  const [x, y] = toImg(cx, cy); const val = tool === "erase" ? 0 : curIdx;
  const mir = mirror && cur.pic.lr;
  if (!last) { stamp2(x, y, val, mir); last = [x, y]; return; }
  const dx = x - last[0], dy = y - last[1], dist = Math.hypot(dx, dy), step = Math.max(1, brush / 3);
  for (let t = step; t <= dist; t += step) stamp2(last[0] + dx * t / dist, last[1] + dy * t / dist, val, mir);
  stamp2(x, y, val, mir); last = [x, y];
}
function stamp2(x, y, val, mir) {
  stampOne(x, y, val);
  if (mir) stampOne(2 * axis() - x, y, val ? mirrorIdx(val) : 0);
}
function stampOne(ox, cy, v) {
  const { W, H, lab, body } = cur; const r = brush, r2 = r * r;
  const x0 = Math.max(0, Math.floor(ox - r)), x1 = Math.min(W - 1, Math.ceil(ox + r));
  const y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(H - 1, Math.ceil(cy + r));
  if (x1 < x0 || y1 < y0) return;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const dx = x - ox, dy = y - cy; if (dx * dx + dy * dy > r2) continue;
    const i = y * W + x; if (!body[i] || lab[i] === v) continue;
    if (!stroke.changes.has(i)) stroke.changes.set(i, lab[i]);
    lab[i] = v;
  }
  grow(x0, y0, x1, y1); renderRect(x0 - 1, y0 - 1, x1 + 1, y1 + 1);
}

stage.addEventListener("pointerdown", (e) => {
  if (!cur) return;
  stage.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 2) {
    if (stroke) endStroke(false);
    last = null; tapStart = null; panning = null;
    const [a, b] = [...pts.values()];
    pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), c: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2] };
    return;
  }
  if (pts.size > 2) return;
  showUnder(underAt(e.clientX, e.clientY)); moveCursor(e.clientX, e.clientY);
  const moveMode = tool === "move" || e.button === 1 || e.button === 2 || e.shiftKey;
  if (moveMode) { panning = [e.clientX, e.clientY]; return; }
  if (tool === "paint" || tool === "erase") {
    if (tool === "paint" && !curIdx) { toast("먼저 칠할 근육을 고르세요"); return; }
    beginStroke(); last = null; paintTo(e.clientX, e.clientY);
  } else tapStart = [e.clientX, e.clientY];
});
stage.addEventListener("pointermove", (e) => {
  if (!cur) return;
  if (!pts.has(e.pointerId)) { if (e.pointerType === "mouse") { moveCursor(e.clientX, e.clientY); showUnder(underAt(e.clientX, e.clientY)); } return; }
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinch && pts.size >= 2) {
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]), c = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    view.tx += c[0] - pinch.c[0]; view.ty += c[1] - pinch.c[1];
    zoomAt(c[0], c[1], d / pinch.d);
    pinch = { d, c }; return;
  }
  moveCursor(e.clientX, e.clientY); showUnder(underAt(e.clientX, e.clientY));
  if (panning) { view.tx += e.clientX - panning[0]; view.ty += e.clientY - panning[1]; panning = [e.clientX, e.clientY]; applyView(); return; }
  if (stroke) paintTo(e.clientX, e.clientY);
});
function up(e) {
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  if (pinch) { if (pts.size < 2) pinch = null; return; }
  if (panning) { panning = null; return; }
  if (stroke) { endStroke(true); last = null; return; }
  if (tapStart && Math.hypot(e.clientX - tapStart[0], e.clientY - tapStart[1]) < 12) {
    const u = underAt(e.clientX, e.clientY);
    if (u && u.v >= 0) {
      if (tool === "pick") {
        if (u.v) { curIdx = u.v; showCur(); toast("고름: " + label(u.v)); setTool("paint"); } else toast("근육 아님 칸입니다");
      } else if (tool === "fill") {
        if (!curIdx) { toast("먼저 칠할 근육을 고르세요"); }
        else {
          const u0 = cur.undo.length;
          let n = fillAt(u.x, u.y, curIdx);
          if (mirror && cur.pic.lr) {
            const mx = Math.round(2 * axis() - u.x);
            if (mx >= 0 && mx < cur.W) n += fillAt(mx, u.y, mirrorIdx(curIdx));
            if (cur.undo.length === u0 + 2) mergeLast();     // 양쪽 다 바뀌었을 때만 한 걸음으로
          }
          toast(n ? `${label(u.v)} → ${label(curIdx)} (${n.toLocaleString()}칸)` : "이미 같은 근육입니다"); }
      }
    }
  }
  tapStart = null;
}
stage.addEventListener("pointerup", up);
stage.addEventListener("pointercancel", (e) => { if (stroke) endStroke(false); pts.delete(e.pointerId); pinch = null; panning = null; tapStart = null; });
stage.addEventListener("pointerleave", () => { $("cursor").style.display = "none"; });
stage.addEventListener("contextmenu", (e) => e.preventDefault());
stage.addEventListener("wheel", (e) => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
stage.addEventListener("dblclick", () => cur && fit());

// ───── 도구 줄 ─────
function setTool(t) {
  tool = t;
  for (const [id, n] of [["tPaint", "paint"], ["tErase", "erase"], ["tFill", "fill"], ["tPick", "pick"], ["tMove", "move"]]) $(id).setAttribute("aria-pressed", String(n === t));
  if (t === "fill") toast("바꿀 칸을 한 번 누르면 그 칸 전체가 지금 근육이 됩니다");
  if (t === "pick") toast("그림에서 근육을 누르면 그 근육을 고릅니다");
}
$("tPaint").onclick = () => setTool("paint");
$("tErase").onclick = () => setTool("erase");
$("tFill").onclick = () => setTool("fill");
$("tPick").onclick = () => setTool("pick");
$("tMove").onclick = () => setTool("move");
$("size").oninput = (e) => { brush = +e.target.value; $("sizeV").textContent = brush; };
$("opa").oninput = (e) => { opa = e.target.value / 100; renderAll(); };
$("undo").onclick = () => { const s = cur.undo.pop(); if (s) { cur.redo.push(s); applyStep(s, false); } };
$("redo").onclick = () => { const s = cur.redo.pop(); if (s) { cur.undo.push(s); applyStep(s, true); } };
function tog(id, get, set) { $(id).onclick = () => { set(!get()); $(id).setAttribute("aria-pressed", String(get())); }; }
tog("mirror", () => mirror, (v) => { mirror = v; toast(v ? "좌우 같이 칠합니다 (반대쪽은 반대쪽 근육으로)" : "한쪽만 칠합니다"); });
tog("tagsBtn", () => showTags, (v) => { showTags = v; updateTags(); });
tog("edgeBtn", () => showEdge, (v) => { showEdge = v; renderAll(); });
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); (e.shiftKey ? $("redo") : $("undo")).click(); }
  else if (e.key === "[") { $("size").value = brush = Math.max(2, brush - 2); $("sizeV").textContent = brush; }
  else if (e.key === "]") { $("size").value = brush = Math.min(60, brush + 2); $("sizeV").textContent = brush; }
});

function showCur() {
  const p = pal[curIdx];
  $("curSw").style.background = p ? p.hex : "transparent";
  $("curName").textContent = p ? label(curIdx) : "근육 고르기";
  $("curId").textContent = p ? p.근육 + (p.쪽 ? " · " + p.쪽 : "") : "";
}

// ───── 근육 고르기 시트 ─────
function itemBtn(i) {
  const p = pal[i]; const b = document.createElement("button"); b.className = "item" + (i === curIdx ? " on" : "");
  b.innerHTML = '<span class="sw"></span><span class="t"><div></div><div></div></span>';
  b.querySelector(".sw").style.background = p.hex;
  b.querySelector(".t div:first-child").textContent = label(i);
  b.querySelector(".t div:last-child").textContent = p.근육 + (p.쪽 ? " · " + p.쪽 : "");
  b.onclick = () => { curIdx = i; showCur(); $("sheet").hidden = true; if (tool !== "fill") setTool("paint"); };
  return b;
}
function renderList() {
  const q = $("q").value.trim().toLowerCase(); const list = $("list"); list.innerHTML = "";
  const want = (i) => (!!pal[i].쪽) === !!cur.pic.lr;
  const match = (i) => !q || label(i).toLowerCase().includes(q) || pal[i].이름.toLowerCase().includes(q) || pal[i].근육.includes(q);
  const used = new Set(); for (let k = 0; k < cur.lab.length; k += 4) if (cur.lab[k]) used.add(cur.lab[k]);
  const sec = (title, ids) => {
    if (!ids.length) return;
    const h = document.createElement("h3"); h.textContent = title; list.appendChild(h);
    const g = document.createElement("div"); g.className = "items"; ids.forEach((i) => g.appendChild(itemBtn(i))); list.appendChild(g);
  };
  const usedIds = [...used].filter((i) => want(i) && match(i)).sort((a, b) => label(a).localeCompare(label(b), "ko"));
  sec(`이 그림에 칠한 근육 (${usedIds.length})`, usedIds);
  for (const r of REGION_ORDER) {
    const ids = []; for (let i = 1; i < pal.length; i++) if (pal[i].region === r && want(i) && match(i) && !used.has(i)) ids.push(i);
    sec((regionName[r] || r) + " — 아직 안 칠한 근육", ids);
  }
  if (!list.children.length) list.innerHTML = '<p style="color:var(--muted);font-size:13px">찾는 근육이 없습니다.</p>';
}
$("pickBtn").onclick = () => { if (!cur) return; $("q").value = ""; renderList(); $("sheet").hidden = false; };
$("q").oninput = renderList;
$("closeSheet").onclick = () => { $("sheet").hidden = true; };
$("sheet").onclick = (e) => { if (e.target.id === "sheet") $("sheet").hidden = true; };

// ───── 저장 (db: edits/<그림 id>) ─────
function exportPng() {
  const { W, H, lab, body } = cur; const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d"); const im = x.createImageData(W, H); const d = im.data;
  for (let i = 0; i < W * H; i++) { const v = lab[i]; if (!v || !body[i]) continue; const k = pal[v].rgb; d[i * 4] = k[0]; d[i * 4 + 1] = k[1]; d[i * 4 + 2] = k[2]; d[i * 4 + 3] = 255; }
  x.putImageData(im, 0, 0); return c.toDataURL("image/png");
}
async function loadSaved(st) {
  if (!db) return;
  try {
    const snap = await db.doc("edits/" + st.pic.id).get();
    if (!snap.exists) return;
    const d = snap.data(); if (!d || !d.png) return;
    const im = await loadImg(d.png);
    if (im.naturalWidth !== st.W || im.naturalHeight !== st.H) return;
    st.lab = decodeMap(pixels(im), st.W * st.H).lab;
    st.from = "저장본 " + new Date(d.시각).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
    st.memo = d.메모 || "";
  } catch (e) { /* 저장본 없이 자동 지도로 */ }
}
$("saveBtn").onclick = () => {
  if (!cur) return;
  $("memo").value = cur.memo || "";
  $("saveInfo").textContent = db
    ? `「${cur.pic.name}」의 지금 지도를 저장합니다. Claude 가 읽어 저장소 지도에 옮깁니다.`
    : "이 화면에서는 저장할 수 없습니다(로그인한 claude.ai 에서 열어 주세요). 손질은 이 창을 닫으면 사라집니다.";
  $("doSave").disabled = !db; $("saveSheet").hidden = false;
};
$("cancelSave").onclick = () => { $("saveSheet").hidden = true; };
let resetArm = 0;
$("resetAuto").onclick = () => {
  if (Date.now() - resetArm > 3000) { resetArm = Date.now(); $("resetAuto").textContent = "한 번 더 누르면 되돌립니다"; setTimeout(() => { $("resetAuto").textContent = "처음 지도로 되돌리기"; }, 3000); return; }
  resetArm = 0; $("resetAuto").textContent = "처음 지도로 되돌리기";
  cur.lab = cur.auto.slice(); cur.undo = []; cur.redo = []; cur.dirty = true; cur.from = "처음 지도";
  renderAll(); updateTags(); updateUndo(); updateSrc(); $("saveSheet").hidden = true; toast("처음 지도로 되돌렸습니다 (저장해야 남습니다)");
};
$("doSave").onclick = async () => {
  const png = exportPng();
  if (png.length > 250000) { toast("지도가 너무 커서 저장할 수 없습니다", 3000); return; }
  $("doSave").disabled = true; $("doSave").textContent = "저장 중…";
  const now = new Date().toISOString();
  try {
    await db.doc("edits/" + cur.pic.id).set({ 그림: cur.pic.file, png, 시각: now, 메모: $("memo").value.trim(), 확인: false });
    cur.dirty = false; cur.memo = $("memo").value.trim();
    cur.from = "저장본 " + new Date(now).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
    updateSrc(); $("saveSheet").hidden = true; toast("저장했습니다");
  } catch (e) {
    toast(e && e.code === "invalid_argument" ? "저장 권한이 없습니다" : "저장하지 못했습니다. 잠시 뒤 다시 눌러 주세요", 3000);
  }
  $("doSave").disabled = false; $("doSave").textContent = "저장";
};
window.addEventListener("beforeunload", (e) => { if (Object.values(cache).some((s) => s.dirty)) { e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("resize", () => cur && applyView());

// ───── 시작 ─────
(async () => {
  for (const p of PICS) {
    const b = document.createElement("button"); b.dataset.id = p.id; b.setAttribute("aria-pressed", "false");
    b.innerHTML = '<span></span><span class="saved-dot" hidden title="저장 안 한 손질"></span>';
    b.firstChild.textContent = p.name; b.onclick = () => openPic(p); $("pics").appendChild(b);
  }
  try { await loadTables(); } catch (e) { $("loading").textContent = "근육 목록을 불러오지 못했습니다"; return; }
  const dbP = window.claude && window.claude.use ? window.claude.use("db").catch(() => null) : Promise.resolve(null);
  // db 는 늦게 올 수 있다: 먼저 그림을 띄우고, db 가 오면 저장본을 다시 확인한다
  await openPic(PICS[0]);
  db = await dbP;
  if (db) {
    for (const st of Object.values(cache)) if (!st.dirty) { await loadSaved(st); }
    if (cur && !cur.dirty) { renderAll(); updateTags(); updateSrc(); }
  } else {
    $("saveBtn").title = "이 화면에서는 저장할 수 없습니다";
  }
})();
})();
</script>
