<title>근육 색 입히기 시안</title>
<style>
/* 폰 한 열: 위 = 고르기(그림 · 운동한 날 · 지난 시간) · 가운데 = 네 방식 2×2 · 누르면 크게. 색 · 글자 · 여백은 앱 Theme.kt 값 */
:root {
  --바탕: #F8FAFB; --면: #FFFFFF; --면2: #F0F4F8; --선: #D3DFE9; --속선: #B5C9DA;
  --글: #000000; --흐림: #35495B; --옅음: #5E6B77; --강조: #084B83; --강조글: #FFFFFF;
  --font: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --바탕: #07121E; --면: #111F2E; --면2: #172738; --선: #253A50; --속선: #37526E;
  --글: #E5F0FA; --흐림: #C5D1DB; --옅음: #9BA7B3; --강조: #7FB3E6; --강조글: #04213D; color-scheme: dark; } }
:root[data-theme="dark"] {
  --바탕: #07121E; --면: #111F2E; --면2: #172738; --선: #253A50; --속선: #37526E;
  --글: #E5F0FA; --흐림: #C5D1DB; --옅음: #9BA7B3; --강조: #7FB3E6; --강조글: #04213D; color-scheme: dark; }
body { background: var(--바탕); color: var(--글); font-family: var(--font); letter-spacing: -0.01em; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 12px; padding-block: 12px 24px; display: grid; gap: 12px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; line-height: 1.25; text-wrap: balance; }
.lead { font-size: 13px; color: var(--흐림); margin: 4px 0 0; line-height: 1.4; }
.card { background: var(--면); border: 1px solid var(--선); border-radius: 16px; padding: 12px; display: grid; gap: 8px; }
.lbl { font-size: 11px; font-weight: 700; color: var(--옅음); letter-spacing: 0.04em; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { font: inherit; font-size: 13px; font-weight: 700; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--속선); background: var(--면2); color: var(--글); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--강조); border-color: var(--강조); color: var(--강조글); }
.chip:focus-visible, .st:focus-visible { outline: 2px solid var(--강조); outline-offset: 2px; }
.time { display: flex; align-items: center; gap: 8px; }
.time input { flex: 1; min-width: 0; accent-color: var(--강조); }
.time output { font-size: 13px; font-weight: 700; min-width: 92px; text-align: right; font-variant-numeric: tabular-nums; }
.scale { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--옅음); }
.scale .bar { flex: 1; height: 8px; border-radius: 4px; }
.what { font-size: 13px; color: var(--흐림); line-height: 1.4; margin: 0; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.st { font: inherit; color: inherit; text-align: left; background: var(--면); border: 1px solid var(--선); border-radius: 16px; padding: 8px; display: grid; gap: 4px; cursor: pointer; min-width: 0; }
.st canvas { width: 100%; height: auto; display: block; border-radius: 8px; }
.st .nm { font-size: 15px; font-weight: 700; }
.st .nm b { color: var(--강조); margin-right: 4px; }
.st .ds { font-size: 11px; color: var(--옅음); line-height: 1.4; }

.big { position: fixed; inset: 0; background: var(--바탕); z-index: 5; display: flex; flex-direction: column; padding: calc(8px + env(safe-area-inset-top, 0px)) 12px calc(12px + env(safe-area-inset-bottom, 0px)); gap: 8px; }
.big .head { display: flex; align-items: center; gap: 8px; background: var(--강조); color: var(--강조글); border-radius: 8px; height: 40px; padding: 0 4px 0 12px; }
.big .head span { flex: 1; font-size: 18px; font-weight: 700; }
.big .head button { font: inherit; font-size: 13px; font-weight: 700; height: 32px; padding: 0 12px; border-radius: 8px; border: 0; background: var(--강조글); color: var(--강조); cursor: pointer; }
.big .view { flex: 1; min-height: 0; display: grid; place-items: center; }
.big canvas { max-width: 100%; max-height: 100%; }
.big .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.note { font-size: 11px; color: var(--옅음); line-height: 1.4; margin: 0; }
</style>

<div class="wrap">
  <header>
    <h1>근육 색 입히기 시안</h1>
    <p class="lead">같은 그림 · 같은 운동을 네 가지 방식으로 칠했습니다. 누르면 크게 봅니다.</p>
  </header>

  <section class="card" aria-label="고르기">
    <div class="lbl">그림</div>
    <div class="chips" id="pics"></div>
    <div class="lbl">운동한 날</div>
    <div class="chips" id="days"></div>
    <p class="what" id="what"></p>
    <div class="lbl">운동 끝나고 지난 시간 (회복)</div>
    <div class="time"><input id="t" type="range" min="0" max="24" step="1" value="0" aria-label="지난 시간"><output id="tv" for="t">운동 직후</output></div>
    <div class="scale"><span>1단계</span><div class="bar" id="bar"></div><span>20단계</span></div>
    <div class="chips"><button class="chip" id="themeBtn" aria-pressed="false">어두운 화면으로 보기</button></div>
  </section>

  <section class="grid" id="grid" aria-label="네 방식"></section>
  <p class="note">색표는 앱의 기본 '노랑-주황-빨강'(20단계). 회복은 07 규칙대로 근육마다 휴식 24시간 × (단계 ÷ 20) 동안 줄어듭니다. 근육 경계는 1차 지도 그대로라 군데군데 어긋날 수 있습니다.</p>
</div>

<div class="big" id="big" hidden>
  <div class="head"><span id="bigName"></span><button id="bigClose">닫기</button></div>
  <div class="view"><canvas id="bigCv"></canvas></div>
  <div class="tabs" id="bigTabs"></div>
</div>

<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const PICS = [
  { id: "front", name: "전신 앞", k: 0.5 }, { id: "back", name: "전신 뒤", k: 0.5 },
  { id: "chest", name: "가슴 확대", k: 0.7 }, { id: "arm", name: "팔~어깨", k: 0.7 },
  { id: "leg", name: "굽힌 다리", k: 0.7 }, { id: "upback", name: "등 확대", k: 0.7 },
];
// 운동한 날: 근육 id → 끝났을 때 단계 (쪽 없으면 양쪽). 주동 20 · 보조 10 · 협응 5 안팎
const DAYS = [
  { id: "chest", name: "가슴 날", what: "벤치프레스 · 딥스 — 가슴 주동, 어깨 앞 · 삼두 보조", pic: "front",
    lv: { chest_mid: 20, chest_upper: 16, chest_lower: 18, delt_front: 12, triceps: 10, serratus: 5, abs: 3 } },
  { id: "legs", name: "하체 날", what: "스쿼트 · 루마니안 데드리프트 — 허벅지 앞 · 엉덩이 주동, 햄스트링 보조", pic: "back",
    lv: { quads: 20, gluteus_maximus: 18, gluteus_medius: 8, hamstrings: 14, adductors: 10, lower_back: 8, calves: 4, abs: 4, tfl: 6, sartorius: 6 } },
  { id: "back", name: "등 날", what: "턱걸이 · 바벨 로우 — 광배 주동, 등 가운데 · 이두 보조", pic: "upback",
    lv: { lats: 20, teres_major: 16, traps_mid: 14, traps_lower: 12, infraspinatus: 9, delt_rear: 12, biceps: 10, brachioradialis: 8, forearm: 5, lower_back: 5 } },
  { id: "curl", name: "왼팔만", what: "덤벨 컬(왼팔만) — 한쪽만 칠해지는 경우", pic: "front",
    lv: { "biceps|L": 20, "brachialis|L": 16, "brachioradialis|L": 12, "forearm|L": 6 } },
];
const STYLES = [
  { id: "A", name: "덮어 칠하기", ds: "근육 칸을 색으로 덮는다. 가장 또렷하고 단순하다" },
  { id: "B", name: "물들이기", ds: "명암은 그대로 두고 색만 입힌다. 조각에 물감을 바른 느낌" },
  { id: "C", name: "번지기", ds: "경계를 흐리게 번지게 한다. 열이 오른 듯한 느낌" },
  { id: "D", name: "테두리", ds: "근육 둘레를 색 선으로 긋고 안은 옅게. 그림이 가장 덜 가려진다" },
];
const HEAT = [[0.05, "#FFE9A3"], [0.35, "#F9C23C"], [0.65, "#F2802E"], [1.0, "#D12D24"]];

// ───── 색표 20단계 ─────
const hex = (h) => [1, 3, 5].map((k) => parseInt(h.slice(k, k + 2), 16));
const STEP = [null];
for (let s = 1; s <= 20; s++) {
  const at = s / 20; let i = 0; while (i < HEAT.length - 1 && HEAT[i + 1][0] < at) i++;
  const [a0, c0] = HEAT[i], [a1, c1] = HEAT[Math.min(i + 1, HEAT.length - 1)];
  const f = a1 === a0 ? 0 : Math.min(1, Math.max(0, (at - a0) / (a1 - a0)));
  const A = hex(c0), B = hex(c1); STEP.push(A.map((v, k) => Math.round(v + (B[k] - v) * f)));
}
$("bar").style.background = `linear-gradient(90deg, ${STEP.slice(1).map((c, i) => `rgb(${c}) ${(i / 19 * 100).toFixed(1)}%`).join(",")})`;

// ───── 근육 나무 · 색표(이름표 색 → 근육) ─────
let palette = [null], parentOf = {};
const isUnder = (id, anc) => { for (let m = id; m; m = parentOf[m]) if (m === anc) return true; return false; };
function levelFor(key, lv) {
  const [id, side] = key; let best = 0;
  for (const [k, v] of Object.entries(lv)) {
    const [eid, es = ""] = k.split("|");
    if (es && side && es !== side) continue;
    if (isUnder(id, eid) || isUnder(eid, id)) best = Math.max(best, v);
  }
  return best;
}

// ───── 그림 불러오기 (작업 해상도로 줄여서) ─────
const cache = {};
function loadImg(src) { return new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = bad; im.src = src; }); }
function px(im, w, h, smooth) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d", { willReadFrequently: true }); x.imageSmoothingEnabled = smooth; x.drawImage(im, 0, 0, w, h);
  return x.getImageData(0, 0, w, h).data;
}
async function getPic(p) {
  if (cache[p.id]) return cache[p.id];
  const [im, mp] = await Promise.all([loadImg("img/" + p.id + ".png"), loadImg("map/" + p.id + ".png")]);
  const w = Math.round(im.naturalWidth * p.k), h = Math.round(im.naturalHeight * p.k), n = w * h;
  const base = px(im, w, h, true);
  // 지도는 가까운 픽셀로 줄인다(색이 섞이면 안 됨)
  const mpx = px(mp, w, h, false); const lab = new Uint16Array(n);
  const rgbIdx = cache._rgb;
  for (let i = 0; i < n; i++) if (mpx[i * 4 + 3] > 127) lab[i] = rgbIdx.get((mpx[i * 4] << 16) | (mpx[i * 4 + 1] << 8) | mpx[i * 4 + 2]) || 0;
  const labels = [...new Set(lab)].filter(Boolean);
  return (cache[p.id] = { w, h, n, base, lab, labels });
}

// ───── 칠하기 ─────
function levels(P, day, hours) {
  const lv = new Float32Array(palette.length);
  for (const L of P.labels) {
    const s = levelFor([palette[L].id, palette[L].side], day.lv);
    if (!s) continue;
    const rest = 24 * s / 20;                          // 07 규칙 5절
    const now = hours >= rest ? 0 : s * (rest - hours) / rest;
    lv[L] = now > 0 ? Math.max(1, Math.ceil(now - 1e-6)) : 0;
  }
  return lv;
}
function blur(src, w, h, r, passes) {          // 상자 흐림 여러 번 = 가우스 비슷
  let a = src, b = new Float32Array(src.length); const ch = src.length / (w * h);
  for (let p = 0; p < passes; p++) {
    for (let y = 0; y < h; y++) for (let c = 0; c < ch; c++) {        // 가로
      let acc = 0; const row = y * w;
      for (let x = -r; x <= r; x++) acc += a[(row + Math.min(w - 1, Math.max(0, x))) * ch + c];
      for (let x = 0; x < w; x++) {
        b[(row + x) * ch + c] = acc / (2 * r + 1);
        acc += a[(row + Math.min(w - 1, x + r + 1)) * ch + c] - a[(row + Math.max(0, x - r)) * ch + c];
      }
    }
    for (let x = 0; x < w; x++) for (let c = 0; c < ch; c++) {        // 세로
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += b[(Math.min(h - 1, Math.max(0, y)) * w + x) * ch + c];
      for (let y = 0; y < h; y++) {
        a[(y * w + x) * ch + c] = acc / (2 * r + 1);
        acc += b[(Math.min(h - 1, y + r + 1) * w + x) * ch + c] - b[(Math.max(0, y - r) * w + x) * ch + c];
      }
    }
  }
  return a;
}
function render(P, lv, style, cv) {
  const { w, h, n, base, lab } = P; cv.width = w; cv.height = h;
  const ctx = cv.getContext("2d"); const out = ctx.createImageData(w, h); const o = out.data;
  o.set(base);
  let field = null;
  if (style === "C") {
    field = new Float32Array(n * 4);
    for (let i = 0; i < n; i++) { const s = lv[lab[i]]; if (!s) continue; const c = STEP[s]; field[i * 4] = c[0]; field[i * 4 + 1] = c[1]; field[i * 4 + 2] = c[2]; field[i * 4 + 3] = 1; }
    blur(field, w, h, Math.max(2, Math.round(w / 90)), 3);
  }
  for (let i = 0; i < n; i++) {
    const j = i * 4, al = base[j + 3]; if (al < 8) continue;
    const L = (base[j] * 0.3 + base[j + 1] * 0.59 + base[j + 2] * 0.11) / 255;   // 명암 0~1
    if (style === "C") {
      const a = field[j + 3]; if (a < 0.01) continue;
      const k = Math.min(1, a * 1.15) * 0.88, sh = 0.45 + 0.75 * L;
      for (let c = 0; c < 3; c++) o[j + c] = base[j + c] * (1 - k) + Math.min(255, (field[j + c] / a) * sh) * k;
      continue;
    }
    const s = lv[lab[i]]; if (!s) continue; const c = STEP[s];
    if (style === "A") {
      for (let q = 0; q < 3; q++) o[j + q] = base[j + q] * 0.18 + c[q] * 0.82;
    } else if (style === "B") {
      const sh = Math.min(1.25, 0.25 + 1.05 * L);                      // 명암을 살린 색
      for (let q = 0; q < 3; q++) o[j + q] = base[j + q] * 0.1 + Math.min(255, c[q] * sh) * 0.9;
    } else if (style === "D") {
      const x = i % w, y = (i / w) | 0, me = lab[i], t = Math.max(1, Math.round(w / 260));
      let edge = false;
      for (let d = 1; d <= t && !edge; d++) {
        if ((x >= d && lab[i - d] !== me) || (x < w - d && lab[i + d] !== me) || (y >= d && lab[i - d * w] !== me) || (y < h - d && lab[i + d * w] !== me)) edge = true;
      }
      const k = edge ? 1 : 0.28;
      for (let q = 0; q < 3; q++) o[j + q] = base[j + q] * (1 - k) + c[q] * k;
    }
  }
  ctx.putImageData(out, 0, 0);
}

// ───── 화면 ─────
let pic = PICS[0], day = DAYS[0], hours = 0, bigStyle = null;
function chipRow(el, items, cur, onPick) {
  el.innerHTML = "";
  for (const it of items) {
    const b = document.createElement("button"); b.className = "chip"; b.textContent = it.name;
    b.setAttribute("aria-pressed", String(it === cur)); b.onclick = () => onPick(it); el.appendChild(b);
  }
}
function drawControls() {
  chipRow($("pics"), PICS, pic, (p) => { pic = p; drawControls(); redraw(); });
  chipRow($("days"), DAYS, day, (d) => { day = d; pic = PICS.find((p) => p.id === d.pic) || pic; drawControls(); redraw(); });
  $("what").textContent = day.what;
}
const tiles = {};
function buildGrid() {
  for (const s of STYLES) {
    const b = document.createElement("button"); b.className = "st"; b.setAttribute("aria-label", s.name + " 크게 보기");
    b.innerHTML = '<canvas></canvas><div class="nm"><b></b><span></span></div><div class="ds"></div>';
    b.querySelector("b").textContent = s.id; b.querySelector(".nm span").textContent = s.name; b.querySelector(".ds").textContent = s.ds;
    b.onclick = () => openBig(s); $("grid").appendChild(b); tiles[s.id] = b.querySelector("canvas");
  }
  for (const s of STYLES) {
    const b = document.createElement("button"); b.className = "chip"; b.textContent = s.id + " " + s.name; b.dataset.id = s.id;
    b.onclick = () => openBig(s); $("bigTabs").appendChild(b);
  }
}
let token = 0;
async function redraw() {
  const my = ++token; const P = await getPic(pic); if (my !== token) return;
  const lv = levels(P, day, hours);
  for (const s of STYLES) render(P, lv, s.id, tiles[s.id]);
  if (bigStyle) render(P, lv, bigStyle.id, $("bigCv"));
}
function openBig(s) {
  bigStyle = s; $("big").hidden = false; $("bigName").textContent = s.id + " " + s.name;
  document.querySelectorAll("#bigTabs .chip").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.id === s.id)));
  redraw();
}
$("bigClose").onclick = () => { $("big").hidden = true; bigStyle = null; };
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && bigStyle) $("bigClose").click(); });
$("t").oninput = (e) => { hours = +e.target.value; $("tv").textContent = hours ? hours + "시간 뒤" : "운동 직후"; redraw(); };
$("themeBtn").onclick = () => {
  const r = document.documentElement; const dark = r.getAttribute("data-theme") !== "dark";
  r.setAttribute("data-theme", dark ? "dark" : "light");
  $("themeBtn").setAttribute("aria-pressed", String(dark)); $("themeBtn").textContent = dark ? "밝은 화면으로 보기" : "어두운 화면으로 보기";
};
if (matchMedia("(prefers-color-scheme: dark)").matches) { $("themeBtn").textContent = "밝은 화면으로 보기"; $("themeBtn").setAttribute("aria-pressed", "true"); document.documentElement.setAttribute("data-theme", "dark"); }

(async () => {
  buildGrid(); drawControls();
  const [colors, cat] = await Promise.all([fetch("data/colors.json").then((r) => r.json()), fetch("data/catalog.json").then((r) => r.json())]);
  for (const m of cat.muscles) parentOf[m.id] = m.parent;
  const rgb = new Map();
  for (const [h, v] of Object.entries(colors.색)) { const c = hex(h); rgb.set((c[0] << 16) | (c[1] << 8) | c[2], palette.length); palette.push({ id: v.근육, side: v.쪽 }); }
  cache._rgb = rgb;
  redraw();
})();
})();
</script>
